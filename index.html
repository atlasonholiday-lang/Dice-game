// Mixes two hex colors by a 0-1 amount, returning an rgb() string.
function mixHexColors(hexA, hexB, amount) {
  const t = Math.max(0, Math.min(1, amount));
  const toRgb = (hex) => {
    const clean = hex.replace("#", "");
    const n = parseInt(clean, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  };
  const a = toRgb(hexA);
  const b = toRgb(hexB);
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  return `rgb(${r}, ${g}, ${bl})`;
}

// A deliberate, hard-to-trigger-by-accident way to open the reset
// confirmation — requires a full round-trip drag (all the way right, then
// all the way back left, in one continuous gesture) rather than a single
// tap or a one-way drag. The trough reddens progressively on the way out,
// then locks fully red once the far edge is touched — a visual "point of
// no return crossed, now finish the U-turn" cue for the return leg.
function ExitSlider({ onExit }) {
  const trackRef = useRef(null);
  const knobSize = 44;
  const [trackWidth, setTrackWidth] = useState(280);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false); // drives the CSS transition only
  const [hasReachedRight, setHasReachedRight] = useState(false); // for the label/color only

  // Refs, not state, drive the actual drag logic — this avoids the whole
  // listener-attach effect having to depend on `onExit` (which gets a new
  // function identity every render, since the session clock re-renders the
  // parent every second) or on `dragging`/`maxX`. Depending on those caused
  // the window listeners to be torn down and reattached mid-drag, which is
  // very likely why the slide-to-exit wasn't registering reliably.
  const isDraggingRef = useRef(false);
  const onExitRef = useRef(onExit);
  const maxXRef = useRef(1);
  const hasReachedRightRef = useRef(false);

  useEffect(() => {
    onExitRef.current = onExit;
  }, [onExit]);

  useEffect(() => {
    if (trackRef.current) setTrackWidth(trackRef.current.offsetWidth);
  }, []);

  const maxX = Math.max(trackWidth - knobSize - 8, 1);
  useEffect(() => {
    maxXRef.current = maxX;
  }, [maxX]);

  const progress = Math.min(dragX / maxX, 1);
  // Trough starts reddening at 1/4 across on the way out; once the far edge
  // has been touched at least once this gesture, it stays fully red for the
  // return leg regardless of dragX, rather than fading back to green as the
  // knob comes back toward the start.
  const RED_START = 0.25;
  const displayProgress = hasReachedRight ? 1 : progress;
  const redAmount = Math.max(0, Math.min(1, (displayProgress - RED_START) / (1 - RED_START)));
  const trackBg = mixHexColors("#181C15", "#B23A48", redAmount);
  const trackBorder = mixHexColors("#3A3E34", "#B23A48", redAmount);

  const getClientX = (e) => {
    if (typeof e.clientX === "number") return e.clientX;
    if (e.touches && e.touches[0]) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX;
    return null;
  };

  const updateDragPosition = useCallback((clientX) => {
    if (!trackRef.current || clientX == null) return;
    const rect = trackRef.current.getBoundingClientRect();
    let x = clientX - rect.left - knobSize / 2;
    x = Math.max(0, Math.min(x, maxXRef.current));
    setDragX(x);

    const max = maxXRef.current;
    if (!hasReachedRightRef.current && x >= max * 0.95) {
      // Outbound leg complete — lock in the "hot" state for the return leg.
      hasReachedRightRef.current = true;
      setHasReachedRight(true);
    } else if (hasReachedRightRef.current && x <= max * 0.05) {
      // Round trip complete: far edge was touched, and we're back at the
      // start. This is the moment the gesture succeeds — end the drag right
      // here rather than waiting for pointerup.
      hasReachedRightRef.current = false;
      isDraggingRef.current = false;
      setHasReachedRight(false);
      setDragging(false);
      setDragX(0);
      if (onExitRef.current) onExitRef.current();
    }
  }, []);

  const startDrag = useCallback(
    (e) => {
      isDraggingRef.current = true;
      setDragging(true);
      hasReachedRightRef.current = false;
      setHasReachedRight(false);
      updateDragPosition(getClientX(e));
    },
    [updateDragPosition]
  );

  // Attached once, covering Pointer, Mouse, AND Touch events — some browsers
  // or embedded/sandboxed environments don't fire Pointer Events reliably,
  // so we don't bet everything on a single event family. isDraggingRef gates
  // whether these do anything, so there's no repeated subscribe/unsubscribe.
  useEffect(() => {
    const handleMove = (e) => {
      if (!isDraggingRef.current) return;
      if (e.cancelable) e.preventDefault();
      updateDragPosition(getClientX(e));
    };
    const handleEnd = () => {
      if (!isDraggingRef.current) return;
      isDraggingRef.current = false;
      setDragging(false);
      hasReachedRightRef.current = false;
      setHasReachedRight(false);
      setDragX(0);
    };

    window.addEventListener("pointermove", handleMove, { passive: false });
    window.addEventListener("pointerup", handleEnd);
    window.addEventListener("pointercancel", handleEnd);
    window.addEventListener("mousemove", handleMove, { passive: false });
    window.addEventListener("mouseup", handleEnd);
    window.addEventListener("touchmove", handleMove, { passive: false });
    window.addEventListener("touchend", handleEnd);
    window.addEventListener("touchcancel", handleEnd);
    return () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleEnd);
      window.removeEventListener("pointercancel", handleEnd);
      window.removeEventListener("mousemove", handleMove);
      window.removeEventListener("mouseup", handleEnd);
      window.removeEventListener("touchmove", handleMove);
      window.removeEventListener("touchend", handleEnd);
      window.removeEventListener("touchcancel", handleEnd);
    };
  }, [updateDragPosition]);

  return (
    <div
      ref={trackRef}
      onPointerDown={startDrag}
      onMouseDown={startDrag}
      onTouchStart={startDrag}
      style={{
        position: "relative",
        width: "100%",
        height: 52,
        borderRadius: 26,
        background: trackBg,
        border: `1px solid ${trackBorder}`,
        overflow: "hidden",
        transition: dragging ? "none" : "background 0.2s ease, border-color 0.2s ease",
        touchAction: "none",
        cursor: "grab",
      }}
    >
      <div
        style={{
          position: "absolute",
          inset: 0,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 6,
          color: hasReachedRight ? "#FFD9DC" : "#6A6E60",
          fontSize: 12,
          fontWeight: 700,
          letterSpacing: "0.1em",
          textTransform: "uppercase",
          // The outbound leg still fades the label out as the knob approaches
          // it (so it doesn't awkwardly peek out from under the knob). Once
          // the round trip's return leg has started, force it fully visible
          // instead of continuing to apply that same fade — the label sits
          // in the middle of the track, away from the knob, for this whole
          // leg, and it's the most important instruction in the gesture.
          opacity: hasReachedRight ? 1 : 1 - progress * 0.9,
          pointerEvents: "none",
        }}
      >
        {hasReachedRight ? "Now slide back" : "Slide to exit"}
        <ChevronsRight size={15} style={hasReachedRight ? { transform: "scaleX(-1)" } : undefined} />
      </div>
      <div
        style={{
          position: "absolute",
          top: 4,
          left: 4 + dragX,
          width: knobSize,
          height: knobSize,
          borderRadius: "50%",
          background: "#20251F",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          transition: dragging ? "none" : "left 0.2s ease",
          pointerEvents: "none", // the whole trough handles the drag now, not just this circle
        }}
      >
        <X size={20} color="#8A8E80" />
      </div>
    </div>
  );
}

const CLICK_SOUNDS = [SOUND_CLICK_1, SOUND_CLICK_2, SOUND_CLICK_3];
// Measured duration of the whine clip is ~2.38s — give it a beat longer so
// it's clearly finished before the rocket appears.
const WHINE_DELAY_MS = 2400;

// Fresh Audio() per call rather than one shared/reused instance — these can
// in principle overlap (e.g. a fast wrong-then-right retry) and a shared
// element would either cut itself off or need manual currentTime resets.
function playSound(src) {
  try {
    const audio = new Audio(src);
    audio.play().catch(() => {});
    return audio;
  } catch (e) {
    return null;
  }
}

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function DiceGame() {

  const [toplessAvailableIndices, setToplessAvailableIndices] = useState(() => defaultTiers[2].entries.map((_, i) => i));

  const audioCtxRef = useRef(null);
  const beepIntervalRef = useRef(null);
  const wakeLockRef = useRef(null);

  // also the single biggest fix for missed alarms: once iOS actually locks
  // the screen, Safari fully suspends the tab — every timer, every audio
  // node, everything — and no in-page redundancy can survive that. Keeping

  // other alarm channel still works whenever the tab itself is running.
  const requestWakeLock = useCallback(async () => {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLockRef.current = await navigator.wakeLock.request("screen");
      wakeLockRef.current.addEventListener("release", () => {
        wakeLockRef.current = null;
      });
    } catch (e) {

    }
  }, []);

    // screen turned off, app-switched away from). Re-request it the instant
    // the tab is visible again so the screen stays awake for every moment
    // the app is actually in front — this can't prevent the very first
    // hide event, but it stops it from happening a second time in the
    // same session.
    const onVisible = () => {
      if (document.visibilityState === "visible") requestWakeLock();
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      if (wakeLockRef.current) wakeLockRef.current.release().catch(() => {});
    };
  }, [requestWakeLock]);

  const tier = tiers[tierIndex];
  const Shape = SHAPES[tierIndex];

  // --- session clock ---
  useEffect(() => {
    if (sessionRunning) {
      sessionIntervalRef.current = setInterval(() => {
        setSessionSeconds((s) => s + 1);
      }, 1000);
    }
    return () => clearInterval(sessionIntervalRef.current);
  }, [sessionRunning]);

  // --- round countdown ---
  useEffect(() => {
    if (roundRunning && roundSeconds > 0) {
      roundIntervalRef.current = setInterval(() => {
        setRoundSeconds((s) => {
          if (s <= 1) {
            setRoundRunning(false);
            setRoundExpired(true);
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(roundIntervalRef.current);
  }, [roundRunning]);

  // --- nudge: an item's been rolled and its instructions are up, but the
  // timer die hasn't been rolled yet for this round ---
  // activeEntry itself is only set once a time roll happens — every
  // setActiveEntry call already carries a computed `seconds`. The gap
  // between "item rolled" and "time rolled" instead lives in each tier's
  // own roll-index/body-part state while activeEntry is still null:
  //   - massage: massageBodyPart is set by the d4, before the d6 (minutes)
  //   - naked / sexy / kinky: {tier}RollIndex is set by that die, before
  //     the follow-up time roll
  // Kissing has no such gap — its one roll sets label and timer together.
  // After 3 uninterrupted seconds sitting in one of these gaps, pulse the
  // box the same way the expired-alarm screen does, as a nudge to go roll
  // time.
  const awaitingTimeRoll =
    !activeEntry &&
    (!!massageBodyPart ||
      toplessRollIndex !== null ||
      thirdBaseRollIndex !== null ||
      d20RollIndex !== null);
  useEffect(() => {
    if (!awaitingTimeRoll) {
      setAwaitingTimeFlash(false);
      return;
    }
    const t = setTimeout(() => setAwaitingTimeFlash(true), 3000);
    return () => clearTimeout(t);
  }, [awaitingTimeRoll, massageBodyPart, toplessRollIndex, thirdBaseRollIndex, d20RollIndex]);

  // --- alarm sound when round expires ---
  const getCtx = useCallback(() => {
    if (!audioCtxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new AC();
    }
    return audioCtxRef.current;
  }, []);

  // iOS Safari suspends new AudioContexts until they're resumed inside a
  // direct user gesture (a tap). The round timer expires on its own via a
  // background interval, which does NOT count as a gesture — so without
  // this, the very first alarm can be silent even with sound "on."
  // Call this from every button handler so the context is already running
  // by the time an alarm needs to fire.
  const unlockAudio = useCallback(() => {
    try {
      const ctx = getCtx();
      if (ctx.state === "suspended") {
        ctx.resume();
      }
      // Play a near-silent blip so iOS fully commits the context to "running".
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0.00001;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.01);
    } catch (e) {
      // ignore — will retry unlock on the next tap
    }
  }, [getCtx]);

  // --- alarm sound: a short synthesized "sax" lick instead of a plain beep ---
  // Detuned sawtooth pair (+ a sub-oscillator an octave below for chest-tone
  // weight) -> resonant lowpass filter -> a per-note dynamic envelope.
  // Sustained notes get a "swell" (messa di voce: soft-loud-soft) plus a
  // delayed vibrato, the way a player leans into a held note rather than
  // starting it already shaking.
  // --- alarm sound: synthesized funk wah-wah guitar riff (only option) ---
  // "Wah" notes: bandpass filter sweeps open (mimics rocking a wah pedal forward).
  // "Chick" notes: filter clamped low/muffled + very short decay (palm-muted strum).
  // freqStart/freqPeak/freqEnd let a note glide in pitch during its own
  // sustain (a "bend"), rather than staying on one fixed pitch. Muted notes
  // stay short and percussive with a clamped/muffled filter; open notes get
  // a wah-style filter sweep that tracks roughly along with the pitch bend.
  //
  // Signal chain: oscillators -> distortion (waveshaper) -> wah filter
  // (bandpass) -> envelope. Distortion is placed BEFORE the wah filter,
  // matching how funk players commonly chain it for percussive "bite"
  // rather than fattened low end (the reverse order emphasizes bass instead).
  // A short burst of filtered noise at each note's onset adds a pick-attack
  // transient — a big part of what reads as "plucked string" vs. a plain tone.
  const noiseBufferRef = useRef(null);
  const getNoiseBuffer = useCallback((ctx) => {
    if (!noiseBufferRef.current) {
      const len = Math.floor(ctx.sampleRate * 0.05);
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      noiseBufferRef.current = buffer;
    }
    return noiseBufferRef.current;
  }, []);

  const makeDistortionCurve = (amount) => {
    const samples = 2048;
    const curve = new Float32Array(samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < samples; i++) {
      const x = (i * 2) / samples - 1;
      curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  };
  const distortionCurveRef = useRef(null);
  const getDistortionCurve = useCallback(() => {
    if (!distortionCurveRef.current) distortionCurveRef.current = makeDistortionCurve(18);
    return distortionCurveRef.current;
  }, []);

  const playFunkNote = useCallback(
    (ctx, destination, opts = {}) => {
      const { freqStart, freqPeak = null, freqEnd = null, startTime, duration, peakGain = 0.2, muted = false } = opts;

      const osc1 = ctx.createOscillator();
      osc1.type = "sawtooth";
      const osc2 = ctx.createOscillator();
      osc2.type = "square";
      const osc2Gain = ctx.createGain();
      osc2Gain.gain.value = 0.35;

      // pitch envelope
      osc1.frequency.setValueAtTime(freqStart, startTime);
      osc2.frequency.setValueAtTime(freqStart * 1.002, startTime);
      if (freqPeak) {
        const bendUpTime = startTime + duration * 0.42;
        const settleTime = startTime + duration * 0.85;
        const end = freqEnd ?? freqStart;
        osc1.frequency.linearRampToValueAtTime(freqPeak, bendUpTime);
        osc1.frequency.linearRampToValueAtTime(end, settleTime);
        osc2.frequency.linearRampToValueAtTime(freqPeak * 1.002, bendUpTime);
        osc2.frequency.linearRampToValueAtTime(end * 1.002, settleTime);
      }

      // distortion — pre-wah, for midrange bite rather than fattened bass
      const distortion = ctx.createWaveShaper();
      distortion.curve = getDistortionCurve();
      distortion.oversample = "2x";
      const preDistGain = ctx.createGain();
      preDistGain.gain.value = muted ? 1.4 : 2.2; // drive into the curve harder on open notes

      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      const gain = ctx.createGain();

      if (muted) {
        filter.Q.value = 2.5;
        filter.frequency.setValueAtTime(freqStart * 1.8, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain * 0.75, startTime + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      } else {
        filter.Q.value = 6;
        filter.frequency.setValueAtTime(freqStart * 3, startTime);
        if (freqPeak) {
          filter.frequency.linearRampToValueAtTime(freqPeak * 3.2, startTime + duration * 0.42);
          filter.frequency.linearRampToValueAtTime((freqEnd ?? freqStart) * 3, startTime + duration * 0.85);
        }
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.02);
        gain.gain.setValueAtTime(peakGain, startTime + duration * 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      }

      osc1.connect(preDistGain);
      osc2.connect(osc2Gain);
      osc2Gain.connect(preDistGain);
      preDistGain.connect(distortion);
      distortion.connect(filter);
      filter.connect(gain);
      gain.connect(destination);

      [osc1, osc2].forEach((o) => {
        o.start(startTime);
        o.stop(startTime + duration + 0.03);
      });

      // pick-attack transient — a quick click of filtered noise right at onset
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = "highpass";
      noiseFilter.frequency.value = 2200;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(peakGain * (muted ? 0.5 : 0.35), startTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.02);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(destination);
      noise.start(startTime);
      noise.stop(startTime + 0.03);
    },
    [getDistortionCurve, getNoiseBuffer]
  );

  // "Bow": one long note that bends low -> high -> low within its own
  // sustain. "Chicka": two rapid unbent notes pitched above the bow's peak.
  // "Wa-wa": two notes with a slight bend each — the first shorter/sustained
  // less than the bow, the second sustaining longer than the first.
  // Rooted on E2 (82.41 Hz) — the guitar's actual lowest open string, and
  // the idiomatic register for this style of funk wah rhythm part.
  const DEFAULT_RHYTHM = {
    bow: { t: 0.0, dur: 0.55 },
    chick1: { t: 0.62, dur: 0.05 },
    chick2: { t: 0.71, dur: 0.05 },
    wa1: { t: 0.88, dur: 0.32 },
    wa2: { t: 1.24, dur: 0.85 },
  };
  const rhythm = DEFAULT_RHYTHM;

  const FUNK_RIFF = [
    // BOW — E2 bends up to E3 and back down to E2, held
    { freqStart: 82.41, freqPeak: 164.81, freqEnd: 82.41, t: rhythm.bow.t, dur: rhythm.bow.dur, peakGain: 0.24, muted: false },
    // CHICKA CHICKA — two rapid notes, higher than the bow's peak (E3=164.81)
    { freqStart: 220.0, t: rhythm.chick1.t, dur: rhythm.chick1.dur, peakGain: 0.13, muted: true },
    { freqStart: 220.0, t: rhythm.chick2.t, dur: rhythm.chick2.dur, peakGain: 0.13, muted: true },
    // WA — slight bend, shorter sustain than the bow
    { freqStart: 185.0, freqPeak: 207.65, freqEnd: 185.0, t: rhythm.wa1.t, dur: rhythm.wa1.dur, peakGain: 0.2, muted: false },
    // WA — slight bend, longest sustain of the phrase, settles onto the bow's peak note
    { freqStart: 185.0, freqPeak: 207.65, freqEnd: 164.81, t: rhythm.wa2.t, dur: rhythm.wa2.dur, peakGain: 0.22, muted: false },
  ];
  const FUNK_RIFF_DURATION_MS = Math.round((rhythm.wa2.t + rhythm.wa2.dur + 0.3) * 1000);

  const playAlarmSound = useCallback(async () => {
    if (!soundOn) return;
    try {
      const ctx = getCtx();
      // Await the resume BEFORE reading ctx.currentTime. Previously this
      // fired resume() without waiting, then scheduled every note against
      // ctx.currentTime while the context was still suspended (frozen).
      // Web Audio silently drops any note whose start time is already in
      // the past by the time the context actually resumes — so a context
      // that got suspended while the phone was backgrounded/locked could
      // "fire" every note into a scheduling gap and play nothing at all,
      // with no error thrown. This is the most likely explanation for an
      // alarm that worked in testing (context never suspended) but failed
      // once for real (context suspended, then resumed a beat too late).
      if (ctx.state === "suspended") await ctx.resume();
      const master = ctx.createGain();
      master.gain.value = 0.95;
      master.connect(ctx.destination);
      const now = ctx.currentTime;
      FUNK_RIFF.forEach((n) =>
        playFunkNote(ctx, master, {
          freqStart: n.freqStart,
          freqPeak: n.freqPeak,
          freqEnd: n.freqEnd,
          startTime: now + n.t,
          duration: n.dur,
          peakGain: n.peakGain,
          muted: n.muted,
        })
      );
    } catch (e) {
      // audio unavailable, fail silently
    }
  }, [soundOn, getCtx, playFunkNote]);

  useEffect(() => {
    if (roundExpired) {
      playAlarmSound();
      beepIntervalRef.current = setInterval(playAlarmSound, FUNK_RIFF_DURATION_MS);
    } else {
      clearInterval(beepIntervalRef.current);
    }
    return () => {
      clearInterval(beepIntervalRef.current);
    };
  }, [roundExpired, playAlarmSound]);

  // --- redundancy #1: catch up immediately on return ---
  // If the screen locked/backgrounded anyway (wake lock denied, old iOS,
  // etc.), setInterval ticks get throttled or paused outright while
  // hidden. The moment the tab is visible again, fire the alarm right
  // away instead of waiting for the next (possibly late) interval tick.
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === "visible" && roundExpired) {
        playAlarmSound();
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [roundExpired, playAlarmSound]);

  // --- redundancy #2: vibration channel ---
  // A second, non-audio alert running in parallel with the sound so a
  // muted phone, a silenced-switch iPhone, or a missed/suppressed sound
  // still gets caught. NOTE: iOS Safari does not support the Vibration
  // API at all (even for apps added to the home screen) as of this
  // writing, so on this iPhone build `navigator.vibrate` is simply
  // undefined and this effect is a harmless no-op. It's here as a real
  // backup the moment this game is ever opened on Android/Chrome, and
  // costs nothing to leave in.
  useEffect(() => {
    if (roundExpired && navigator.vibrate) {
      navigator.vibrate([400, 200, 400, 200, 400]);
      const vibrateInterval = setInterval(
        () => navigator.vibrate([400, 200, 400, 200, 400]),
        FUNK_RIFF_DURATION_MS
      );
      return () => clearInterval(vibrateInterval);
    }
  }, [roundExpired]);

  // Called on every arrow-button press while the reset confirmation is open.
  // Wrong arrow at any point: shake, wipe progress, let them try again.
  // Right arrow, sequence complete: show the rocket, then actually reset.
  const handleResetArrowPress = (dir) => {
    if (resetSuccess) return;
    const next = [...resetArrowInput, dir];
    const correctSoFar = next.every((d, i) => d === RESET_SEQUENCE[i]);
    if (!correctSoFar) {
      setResetArrowInput([]);
      setResetShake(true);
      clearTimeout(resetShakeTimeoutRef.current);
      resetShakeTimeoutRef.current = setTimeout(() => setResetShake(false), 500);
      // Incorrect-press sound: pending — no audio on a wrong arrow yet.
      return;
    }

    // Correct arrow — one of the three captured click sounds, cycling
    // 1-2-3-1-2-3 across the six-step sequence.
    playSound(CLICK_SOUNDS[(next.length - 1) % CLICK_SOUNDS.length]);

    if (next.length === RESET_SEQUENCE.length) {
      // Sequence complete: keep the boxes showing fully filled, play the
      // electric whine, and only reveal the rocket once the whine has had
      // time to finish — the whine is the "windup" before the payoff.
      setResetArrowInput(next);
      whineAudioRef.current = playSound(SOUND_WHINE);
      clearTimeout(resetSuccessTimeoutRef.current);
      resetSuccessTimeoutRef.current = setTimeout(() => {
        setResetSuccess(true);
        setResetArrowInput([]);
        resetSuccessTimeoutRef.current = setTimeout(() => {
          resetSession();
          setResetSuccess(false);
          setResetConfirmOpen(false);
        }, 1600);
      }, WHINE_DELAY_MS);
    } else {
      setResetArrowInput(next);
    }
  };

  const cancelResetConfirm = () => {
    clearTimeout(resetShakeTimeoutRef.current);
    clearTimeout(resetSuccessTimeoutRef.current);
    if (whineAudioRef.current) {
      whineAudioRef.current.pause();
      whineAudioRef.current = null;
    }
    setResetConfirmOpen(false);
    setResetArrowInput([]);
    setResetShake(false);
    setResetSuccess(false);
  };

  useEffect(() => {
    return () => {
      clearTimeout(resetShakeTimeoutRef.current);
      clearTimeout(resetSuccessTimeoutRef.current);
      if (whineAudioRef.current) whineAudioRef.current.pause();
    };
  }, []);

  const resetSession = () => {
    setHasStarted(false);
    setSessionRunning(false);
    setSessionSeconds(0);
    setTierIndex(0);
    setTokenCount(startingTokens);
    setMassageBodyPart(null);
    setMassageSetIndex(0);
    setMassageAvailableIndices(MASSAGE_SET_A_INDICES);
    setMassageSecretTriggered(false);
    setMassageMinutes(null);
    setMassageTotalSeconds(0);
    setMassageComplete(false);
    setKissMinutes(null);
    setKissDone(false);
    setIsKissRound(false);
    setToplessUnlocked(false);
    setToplessRollIndex(null);
    setToplessMinutes(null);
    setIsToplessRound(false);
    setToplessDone(false);
    setToplessRoundNumber(1);
    setToplessHasRolledOnce(false);
    setToplessAvailableIndices(defaultTiers[2].entries.map((_, i) => i));
    setThirdBaseUnlocked(false);
    setThirdBaseRollIndex(null);
    setThirdBaseAvailableIndices(defaultTiers[3].entries.map((_, i) => i));
    setThirdBaseMinutes(null);
    setThirdBaseHasRolledOnce(false);
    setIsThirdBaseRound(false);
    setThirdBaseDone(false);
    setD20Unlocked(false);
    setD20RollIndex(null);
    setD20AvailableIndices(defaultTiers[4].entries.map((_, i) => i));
    setD20BannedIndices([]);
    setD20Minutes(null);
    setIsD20Round(false);
    setD20FreeTokenMessage(false);
    setD2FlipResult(null);
    clearRound();
  };

  const clearRound = () => {
    setActiveEntry(null);
    setRollInput(null);
    setRoundSeconds(0);
    setRoundRunning(false);
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
  };

  // Step 1 — roll the d4 to pick a spot. Locked to this one tier, so this is
  // always the whole interaction: no manual number entry, no tier switching.
  // Once both spot-sets are used up, the finale runs "Butt massage" for
  // whatever time remains to reach the 10-minute target — no more rolling.
  const beginSecretButtMassage = () => {
    const remainingSeconds = Math.max(60, MASSAGE_TARGET_SECONDS - massageTotalSeconds);
    const minutesExact = remainingSeconds / 60;
    const minutesDisplay = Math.round(minutesExact * 10) / 10;
    setMassageSetIndex(2);
    setMassageSecretTriggered(true);
    setRollInput(null);
    setMassageBodyPart("Butt massage");
    setMassageMinutes(minutesExact);
    setActiveEntry({ label: `Butt massage — ${minutesDisplay} min`, seconds: remainingSeconds });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(remainingSeconds);
    setRoundRunning(true);
  };

  const rollBodyPart = () => {
    unlockAudio();
    playDieRollSound(4);
    if (!hasStarted) {
      setHasStarted(true);
      setSessionRunning(true);
    }

    if (massageAvailableIndices.length === 0) {
      if (massageSetIndex === 0) {
        // primary set exhausted — advance to the secondary set and pick from it right away
        const pick = MASSAGE_SET_B_INDICES[Math.floor(Math.random() * MASSAGE_SET_B_INDICES.length)];
        setMassageSetIndex(1);
        setRollInput(pick + 1);
        setMassageBodyPart(tier.entries[pick].label);
        setMassageAvailableIndices(MASSAGE_SET_B_INDICES.filter((i) => i !== pick));
        return;
      }
      // secondary set also exhausted — the secret finale takes over instead of rolling again
      beginSecretButtMassage();
      return;
    }

    const pool = massageAvailableIndices;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setRollInput(pick + 1);
    setMassageBodyPart(tier.entries[pick].label);
    setMassageAvailableIndices(pool.filter((i) => i !== pick));
  };

  // Step 2 — roll a d6 for minutes; the number IS the minutes, and the timer
  // starts immediately (no separate "start" step).
  const rollMinutesAndStart = () => {
    unlockAudio();
    playDieRollSound(6);
    const minutes = Math.floor(Math.random() * 6) + 1;
    setMassageMinutes(minutes);
    setActiveEntry({ label: `${massageBodyPart} — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  // Step 3 — called when a round ends (dismissing the alarm, or manually
  // clearing). Banks this round's minutes toward the 10-minute target, and
  // loops back to step 1 automatically unless the target's been reached.
  const finishMassageRound = () => {
    const roundSecondsBanked = (massageMinutes || 0) * 60;
    setMassageTotalSeconds((prevTotal) => {
      const newTotal = prevTotal + roundSecondsBanked;
      if (newTotal >= MASSAGE_TARGET_SECONDS) {
        setMassageComplete(true);
      }
      return newTotal;
    });
    clearRound();
    setMassageBodyPart(null);
    setMassageMinutes(null);
  };

  // "Kissing unlocked" round — roll a d4 for minutes (face value = minutes).
  // Now rolled with d6 instead of d4 — d4 is reserved for the one place with
  // an actual player choice (the 3rd base time roll). The old d4-reroll
  // mechanic covered 2-7 minutes across 6 possible outcomes, which a d6 maps
  // onto exactly with whole numbers, so no fractional minutes are needed here.
  const KISS_TIME_OPTIONS = [2, 3, 4, 5, 6, 7];
  const beginKissTimer = (minutes) => {
    setIsKissRound(true);
    setKissMinutes(minutes);
    setActiveEntry({ label: `Kissing — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  const rollKissTime = () => {
    unlockAudio();
    playDieRollSound(6);
    const roll = Math.floor(Math.random() * 6); // 0-5
    beginKissTimer(KISS_TIME_OPTIONS[roll]);
  };

  const finishKissRound = () => {
    clearRound();
    setIsKissRound(false);
    setKissDone(true);
  };

  // Routes round-completion to whichever loop is active — the repeating
  // massage rounds, the one-off kissing round, or the one-off topless round.
  const handleRoundDismiss = () => {
    if (isKissRound) {
      finishKissRound();
    } else if (isToplessRound) {
      finishToplessRound();
    } else if (isThirdBaseRound) {
      finishThirdBaseRound();
    } else if (isD20Round) {
      finishD20Round();
    } else {
      finishMassageRound();
    }
  };

  // Tapping the flashing d8 icon reveals the topless stage.
  const unlockTopless = () => {
    unlockAudio();
    setToplessUnlocked(true);
  };

  // Tapping the flashing d8 icon a second time (after topless is done) reveals 3rd base.
  const unlockThirdBase = () => {
    unlockAudio();
    setThirdBaseUnlocked(true);
  };

  // Tapping the flashing d20 icon (after the d12 HOME RUN round is dismissed).
  const unlockD20 = () => {
    unlockAudio();
    setD20Unlocked(true);
  };

  const rollD20 = () => {
    unlockAudio();
    playDieRollSound(20);
    const usablePool = d20AvailableIndices.filter((i) => !d20BannedIndices.includes(i));
    const fallbackPool = tiers[4].entries.map((_, i) => i).filter((i) => !d20BannedIndices.includes(i));
    const pool = usablePool.length > 0 ? usablePool : fallbackPool;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setD20RollIndex(pick);
    setD2FlipResult(null); // clear any previous coin-flip result on a fresh roll

    // Rolling either butt plug (index 0 or 1) bans all four insertable
    // items (indices 0-3) for the rest of the game, even after the pool
    // would otherwise refill.
    const triggersBan = pick === 0 || pick === 1;
    const newBanned = triggersBan ? [0, 1, 2, 3] : d20BannedIndices;
    if (triggersBan) setD20BannedIndices(newBanned);

    const fullPool = tiers[4].entries.map((_, i) => i).filter((i) => !newBanned.includes(i));
    const remaining = pool.filter((i) => i !== pick && !newBanned.includes(i));
    // On refill, exclude the just-picked item too — otherwise the same
    // result could come up twice in a row right at the cycle boundary.
    setD20AvailableIndices(remaining.length > 0 ? remaining : fullPool.filter((i) => i !== pick));

    // Landing on "Free token" grants it immediately — no timer applies.
    if (tiers[4].entries[pick].special === "freeToken") {
      setD20FreeTokenMessage(true);
      setTokenCount((c) => c + 1);
    } else {
      setD20FreeTokenMessage(false);
    }
  };

  // Roll a d4 for time on the current d20 item, and start its timer.
  const beginD20Timer = () => {
    unlockAudio();
    playDieRollSound(4);
    const minutes = Math.floor(Math.random() * 4) + 1; // 1-4
    setD20Minutes(minutes);
    setIsD20Round(true);
    setActiveEntry({ label: `${tiers[4].entries[d20RollIndex].label} — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  const finishD20Round = () => {
    clearRound();
    setIsD20Round(false);
    setD20RollIndex(null); // back to "Roll dice" for the next round
  };

  // Spend 3 tokens for a coin-flip (d2), 50% chance of "cum".
  const rollD2ForCum = () => {
    if (tokenCount < 3) return;
    unlockAudio();
    setTokenCount((c) => c - 3);
    const flip = Math.random() < 0.5;
    setD2FlipResult(flip ? "success" : "fail");
  };

  const rollThirdBase = () => {
    unlockAudio();
    playDieRollSound(12);
    const pool = thirdBaseAvailableIndices.length > 0 ? thirdBaseAvailableIndices : [D12_HOME_RUN_INDEX];
    const idx = pool[Math.floor(Math.random() * pool.length)];
    setThirdBaseRollIndex(idx);
    setThirdBaseHasRolledOnce(true);
  };

  const beginThirdBaseTimer = (minutes) => {
    setIsThirdBaseRound(true);
    setThirdBaseMinutes(minutes);
    setActiveEntry({ label: `${tiers[3].entries[thirdBaseRollIndex].label} — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  // Roll for time — user picks d4 (1-4 min) or d6 (3-6 min). Since this is a
  // virtual roll, not a physical die, we generate a uniform draw directly
  // over each labeled range rather than mapping 6 physical faces onto a
  // 4-value range (which would make some outcomes twice as likely as
  // others, since 6 doesn't divide evenly by 4).
  const rollThirdBaseMinutesD4 = () => {
    unlockAudio();
    playDieRollSound(4);
    beginThirdBaseTimer(Math.floor(Math.random() * 4) + 1); // uniform 1-4
  };
  const rollThirdBaseMinutesD6 = () => {
    unlockAudio();
    playDieRollSound(6);
    beginThirdBaseTimer(Math.floor(Math.random() * 4) + 3); // uniform 3-6
  };

  // Rolling the finale (penetration) ends the d12 stage — HOME RUN — and
  // moves on to d20 once its timer is dismissed. Any other roll removes its
  // whole category from the pool and loops back to another d12 roll.
  const finishThirdBaseRound = () => {
    const wasHomeRun = thirdBaseRollIndex === D12_HOME_RUN_INDEX;
    clearRound();
    setIsThirdBaseRound(false);
    if (wasHomeRun) {
      setThirdBaseDone(true);
    } else {
      const category = D12_CATEGORIES.find((cat) => cat.includes(thirdBaseRollIndex));
      const toRemove = category || [thirdBaseRollIndex];
      setThirdBaseAvailableIndices((prev) => prev.filter((i) => !toRemove.includes(i)));
      setThirdBaseRollIndex(null); // back to "Roll dice" for the next round
    }
  };

  const rollTopless = () => {
    unlockAudio();
    playDieRollSound(8);
    const fullPool = tiers[2].entries.map((_, i) => i);
    const pool = toplessAvailableIndices.length > 0 ? toplessAvailableIndices : fullPool;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setToplessRollIndex(pick);
    setToplessHasRolledOnce(true);
    setToplessAvailableIndices(pool.filter((i) => i !== pick));
  };

  const beginToplessTimer = (minutes) => {
    setIsToplessRound(true);
    setToplessMinutes(minutes);
    setActiveEntry({ label: `${tiers[2].entries[toplessRollIndex].label} — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  // Now rolled with d6 instead of d4 — d4 is reserved for the one place with
  // an actual player choice (the 3rd base time roll). 6 evenly-spaced values
  // from 1 to 3 minutes (fractional since 6 doesn't divide evenly into a
  // 2-minute span).
  const TOPLESS_TIME_OPTIONS = [1, 1.4, 1.8, 2.2, 2.6, 3];
  const rollToplessMinutes = () => {
    unlockAudio();
    playDieRollSound(6);
    const roll = Math.floor(Math.random() * 6); // 0-5
    beginToplessTimer(TOPLESS_TIME_OPTIONS[roll]);
  };

  // 2nd base loops once — two total rounds — before moving on.
  const finishToplessRound = () => {
    clearRound();
    setIsToplessRound(false);
    if (toplessRoundNumber < 2) {
      setToplessRoundNumber((n) => n + 1);
      setToplessRollIndex(null); // back to "Roll dice" for the second round
    } else {
      setToplessDone(true);
    }
  };

  const testAlarm = () => {
    unlockAudio();
    setRollInput(null);
    setActiveEntry({ label: "Test alarm", seconds: 1 });
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(0);
    setRoundRunning(false);
    setRoundExpired(true); // fire immediately, no countdown wait
  };

  const spendTokenSkipAhead = () => {
    if (tokenCount <= 0) return;
    setTokenCount((c) => c - 1);
    handleRoundDismiss(); // also fully finishes the round, same as the old Clear button
  };

  const updateEntryLabel = (tIdx, eIdx, field, value) => {
    setTiers((prev) => {
      const next = prev.map((t) => ({ ...t, entries: t.entries.map((e) => ({ ...e })) }));
      next[tIdx].entries[eIdx][field] = value;
      return next;
    });
  };

  // Which die (tier index) is actually relevant right now — drives the box
  // color, its buttons, and which ladder icon lights up. Tracks whichever
  // die the next tap (or the currently-running timer) is tied to, not just
  // whatever tier the app is nominally "locked" on.
  const getActiveDieIndex = () => {
    if (!massageComplete) {
      if (activeEntry) return 1; // massage timer running, set by the d6 minutes roll
      if (massageBodyPart) return 1; // waiting on the d6 minutes roll
      return 0; // waiting on the d4 body-part roll
    }
    if (!kissDone) {
      return 1; // kissing is now rolled with d6 for time (its single roll, or its timer)
    }
    if (!toplessUnlocked) {
      return 2; // waiting to tap the flashing d8
    }
    if (!toplessDone) {
      if (activeEntry) return 1; // topless timer running, set by the d6 minutes roll
      if (toplessRollIndex === null) return 2; // waiting on the d8 item roll
      return 1; // item picked, waiting on the d6 minutes roll
    }
    if (!thirdBaseUnlocked) {
      return 3; // waiting to tap the flashing d12
    }
    if (!thirdBaseDone) {
      return 3; // 3rd base loop is entirely d12, until HOME RUN is hit and dismissed
    }
    return 4; // waiting to tap the flashing d20, or d20 stage once unlocked
  };
  const activeDie = tiers[getActiveDieIndex()];

  return (
    <div
      style={{
        minHeight: "100vh",

        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        padding: "24px 16px 40px",

    >
      <style>{`
        @keyframes flashUnlockIcon {

          50% { opacity: 0.25; transform: scale(1.15); }

        @keyframes flashThenBrighten {
          0% { filter: brightness(1); }
          15% { filter: brightness(0.35); }
          30% { filter: brightness(1); }
          45% { filter: brightness(0.35); }
          60% { filter: brightness(1); }
          75% { filter: brightness(0.35); }
          90% { filter: brightness(1); }
          100% { filter: brightness(1.6); }

        @keyframes alarmPulse {

        }
        @keyframes resetShake {
          0%, 100% { transform: translateX(0); }
          20% { transform: translateX(-14px); }
          40% { transform: translateX(12px); }
          60% { transform: translateX(-8px); }
          80% { transform: translateX(8px); }
        }
        @keyframes rocketPop {
          0% { transform: rotate(135deg) scale(0.3); opacity: 0; }
          60% { transform: rotate(135deg) scale(1.15); opacity: 1; }
          100% { transform: rotate(135deg) scale(1); opacity: 1; }
        }
      `}</style>

      {/* Reset confirmation challenge — opened only once the exit slider has
          completed a full right-then-left round trip. */}
      {resetConfirmOpen && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            zIndex: 9999,
            background: resetSuccess

              : "rgba(10,12,9,0.97)",
            transition: "background 0.15s ease",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            padding: 24,
            textAlign: "center",
            animation: resetShake ? "resetShake 0.4s ease" : "none",
          }}
        >
          {resetSuccess ? (
            <div style={{ fontSize: "min(65vw, 55vh)", lineHeight: 1, transform: "rotate(135deg)", animation: "rocketPop 0.4s ease forwards" }}>🚀</div>
          ) : (
            <>
              <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 24, maxWidth: 300 }}>
                Reset game for DEMOCRACY?
              </div>

              {/* Target sequence readout — fills in as each arrow is entered correctly */}
              <div style={{ display: "flex", gap: 8, marginBottom: 32 }}>
                {RESET_SEQUENCE.map((dir, i) => (
                  <div
                    key={i}
                    style={{

                      height: 32,
                      borderRadius: 8,
                      background: i < resetArrowInput.length ? "#3A5E3A" : "#20251F",

                      transition: "background 0.15s ease, border-color 0.15s ease",
                    }}

                    <ArrowIcon direction={dir} size={16} color={i < resetArrowInput.length ? "#D9F7D6" : "#9A9A88"} />
                  </div>
                ))}
              </div>

              {/* Pushable D-pad */}
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(3, 58px)",
                  gridTemplateRows: "repeat(2, 58px)",

                  marginBottom: 32,
                }}
              >
                <div />
                <button onClick={() => handleResetArrowPress("up")} style={arrowBtnStyle} aria-label="Up">
                  <ArrowIcon direction="up" size={24} />

                  <ArrowIcon direction="left" size={24} />

                <button onClick={() => handleResetArrowPress("right")} style={arrowBtnStyle} aria-label="Right">
                  <ArrowIcon direction="right" size={24} />
                </button>
              </div>

              <button onClick={cancelResetConfirm} style={secondaryBtnStyle}>
                Cancel
              </button>
            </>
          )}
        </div>
      )}

      {/* Header: session clock */}
      <div style={{ width: "100%", maxWidth: 420 }}>
        <div style={{ textAlign: "left", fontSize: 10, marginBottom: 14 }}>
          ⬅️🎚️🚫🟥 🔈
        </div>

        {/* Die names — one per die, always visible, colored to match */}
        <div style={{ display: "flex", justifyContent: "space-between", padding: "0 6px", marginBottom: 6 }}>
          {tiers.map((t, i) => (
            <div
              key={i}
              style={{
                flex: 1,
                textAlign: "center",
                fontSize: 10.5,
                fontWeight: 700,
                color: t.color,
              }}
            >
              {DIE_TITLES[t.die]}
            </div>
          ))}
        </div>

        {/* Tier ladder */}
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            marginBottom: 20,
            padding: "10px 6px",
            background: "#20251F",
            borderRadius: 14,
            border: "1px solid #2C3128",
          }}
        >
          {tiers.map((t, i) => {
            const S = SHAPES[i];
            const isActive = i === getActiveDieIndex();
            const isTopplessFlash = i === 2 && kissDone && !toplessUnlocked;
            const isThirdBaseFlash = i === 3 && toplessDone && !thirdBaseUnlocked;
            const isD20Flash = i === 4 && thirdBaseDone && !d20Unlocked;
            const isFlashTarget = isTopplessFlash || isThirdBaseFlash || isD20Flash;
            const flashClickHandler = isTopplessFlash
              ? unlockTopless
              : isThirdBaseFlash
              ? unlockThirdBase
              : isD20Flash
              ? unlockD20
              : undefined;
            return (
              <div
                key={i}
                onClick={flashClickHandler}
                style={{
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  flex: 1,
                  cursor: isFlashTarget ? "pointer" : "default",
                }}
              >
                <S
                  size={isActive || isFlashTarget ? 26 : 18}
                  color={isActive || isFlashTarget ? t.color : "#4A4E44"}
                  fill={isActive || isFlashTarget ? t.color : "none"}
                  strokeWidth={1.5}
                  style={{
                    transition: "all 0.25s ease",
                    animation: isFlashTarget ? "flashUnlockIcon 1s ease-in-out infinite" : "none",
                  }}
                />
                <div
                  style={{
                    fontSize: 10,
                    marginTop: 4,
                    color: isActive || isFlashTarget ? t.color : "#5A5E52",
                    fontWeight: isActive || isFlashTarget ? 700 : 400,
                  }}
                >
                  d{t.die}
                </div>
              </div>
            );
          })}
        </div>

        {/* Current tier card — hidden while a timer is running, since the
            Active Instruction card below covers that entirely */}
        {!activeEntry && (
        <div
          style={{
            background: awaitingTimeFlash ? "#4A2323" : "#20251F",
            border: `1px solid ${awaitingTimeFlash ? "#B23A48" : activeDie.color + "55"}`,
            borderRadius: 18,
            padding: "18px 18px 20px",
            marginBottom: 18,
            transition: "background 0.3s ease, border-color 0.3s ease",
            animation: awaitingTimeFlash ? "alarmPulse 1s ease-in-out infinite" : "none",
          }}
        >
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: activeDie.color, letterSpacing: "0.05em" }}>
              D{activeDie.die}
            </div>
          </div>

          {/* roll flow: roll d4 for a spot, then d6 for minutes — no manual entry */}
          {massageComplete ? (
            <div style={{ textAlign: "center", padding: "6px 0" }}>
              {kissMinutes === null && (
                <div
                  style={{
                    fontSize: 17,
                    fontWeight: 700,
                    color: activeDie.color,
                    marginBottom: 4,
                    animation: "flashThenBrighten 1.3s ease-in-out 1 forwards",
                  }}
                >
                  Kissing unlocked!
                </div>
              )}
              {!activeEntry && !kissDone && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ fontSize: 12, color: "#9A9A88", marginBottom: 8 }}>Roll for time</div>
                  <button onClick={rollKissTime} style={centeredPrimaryBtnStyle(activeDie.color)}>
                    🎲 Roll d6 for minutes
                  </button>
                </div>
              )}
              {!activeEntry && kissDone && !toplessUnlocked && (
                <div style={{ fontSize: 13, color: "#9A9A88", marginTop: 10 }}>
                  <div style={{ animation: "flashThenBrighten 1.3s ease-in-out 1 forwards" }}>2nd base unlocked</div>
                  <div style={{ fontSize: 11, color: "#6A6E60", marginTop: 6 }}>Tap the flashing d8 above</div>
                </div>
              )}
              {!activeEntry && kissDone && toplessUnlocked && !toplessDone && (
                <div style={{ marginTop: 14 }}>
                  {!toplessHasRolledOnce && (
                    <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 16, fontFamily: "Georgia, ui-serif, serif" }}>
                      {tiers[2].name}
                    </div>
                  )}
                  <div style={{ fontSize: 11, color: "#6A6E60", marginBottom: 8 }}>Round {toplessRoundNumber} of 2</div>
                  {toplessRollIndex === null ? (
                    <button onClick={rollTopless} style={centeredPrimaryBtnStyle(tiers[2].color)}>
                      🎲 Roll dice
                    </button>
                  ) : (
                    <div>
                      <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 16, fontFamily: "Georgia, ui-serif, serif" }}>
                        {tiers[2].entries[toplessRollIndex].label}
                      </div>
                      <button onClick={rollToplessMinutes} style={centeredPrimaryBtnStyle(tiers[1].color)}>
                        🎲 Roll d6 for minutes
                      </button>
                    </div>
                  )}
                </div>
              )}
              {!activeEntry && toplessDone && !thirdBaseUnlocked && (
                <div style={{ fontSize: 13, color: "#9A9A88", marginTop: 10 }}>
                  <div style={{ animation: "flashThenBrighten 1.3s ease-in-out 1 forwards" }}>3rd base unlocked</div>
                  <div style={{ fontSize: 11, color: "#6A6E60", marginTop: 6 }}>Tap the flashing d12 above</div>
                </div>
              )}
              {!activeEntry && toplessDone && thirdBaseUnlocked && !thirdBaseDone && (
                <div style={{ marginTop: 14 }}>
                  {!thirdBaseHasRolledOnce && (
                    <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 16, fontFamily: "Georgia, ui-serif, serif" }}>
                      {tiers[3].name}
                    </div>
                  )}
                  {thirdBaseRollIndex === null ? (
                    <button onClick={rollThirdBase} style={centeredPrimaryBtnStyle(tiers[3].color)}>
                      🎲 Roll dice
                    </button>
                  ) : (
                    <div>
                      <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 8, fontFamily: "Georgia, ui-serif, serif" }}>
                        {tiers[3].entries[thirdBaseRollIndex].label}
                      </div>
                      {thirdBaseRollIndex === D12_HOME_RUN_INDEX && (
                        <div
                          style={{
                            fontSize: 18,
                            fontWeight: 700,
                            color: tiers[3].color,
                            marginBottom: 16,
                            animation: "flashThenBrighten 1.3s ease-in-out 1 forwards",
                          }}
                        >
                          HOME RUN!
                        </div>
                      )}
                      <div style={{ fontSize: 12, color: "#9A9A88", marginBottom: 8, marginTop: thirdBaseRollIndex === D12_HOME_RUN_INDEX ? 0 : 16 }}>
                        Roll for time
                      </div>
                      <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
                        <button onClick={rollThirdBaseMinutesD4} style={primaryBtnStyle(tiers[0].color)}>
                          🎲 D4 (1–4 min)
                        </button>
                        <button onClick={rollThirdBaseMinutesD6} style={primaryBtnStyle(tiers[1].color)}>
                          🎲 D6 (3–6 min)
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
              {!activeEntry && thirdBaseDone && !d20Unlocked && (
                <div style={{ fontSize: 13, color: "#9A9A88", marginTop: 10 }}>
                  <div style={{ fontSize: 11, color: "#6A6E60", marginTop: 6 }}>Tap the flashing d20 above</div>
                </div>
              )}
              {!activeEntry && thirdBaseDone && d20Unlocked && (
                <div style={{ marginTop: 14 }}>
                  {d20RollIndex === null ? (
                    <button onClick={rollD20} style={centeredPrimaryBtnStyle(tiers[4].color)}>
                      🎲 Roll dice
                    </button>
                  ) : (
                    <div>
                      <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 8, fontFamily: "Georgia, ui-serif, serif" }}>
                        {tiers[4].entries[d20RollIndex].label}
                      </div>
                      {d20FreeTokenMessage ? (
                        <>
                          <div
                            style={{
                              fontSize: 14,
                              fontWeight: 700,
                              color: "#C9924A",
                              marginBottom: 16,
                              animation: "flashThenBrighten 1.3s ease-in-out 1 forwards",

                          >
                            +1 token!
                          </div>
                          <button onClick={rollD20} style={centeredPrimaryBtnStyle(tiers[4].color)}>

                      ) : (
                        <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
                          <button onClick={beginD20Timer} style={primaryBtnStyle(tiers[0].color)}>
                            🎲 Roll d4 for time

                          <button onClick={rollD20} style={primaryBtnStyle(tiers[4].color)}>
                            🎲 Roll kinky dice again

                      )}
                    </div>
                  )}

                  {/* Roll d2 for a 50% chance to cum — always available once a kinky
                      dice item has been rolled, costs 3 tokens */}
                  {d20RollIndex !== null && (
                    <div

                        marginTop: 18,
                        padding: "12px 14px",
                        background: "#181C15",

                        borderRadius: 14,

                      {d2FlipResult === "fail" && (

            </div>
          ) : !activeEntry ? (
            massageBodyPart ? (
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 12, color: "#9A9A88", marginBottom: 8 }}>You rolled a {rollInput} —</div>

                  {massageBodyPart}

          {!massageComplete && (

        )}

        {/* Active instruction */}
        {activeEntry && (
          <div
            style={{
              background: roundExpired ? "#4A2323" : "#20251F",
              border: `1px solid ${roundExpired ? "#B23A48" : activeDie.color}`,
              borderRadius: 18,
              padding: "20px 18px",
              textAlign: "center",
              transition: "background 0.3s ease",
              animation:
                roundExpired || awaitingTimeFlash ? "alarmPulse 1s ease-in-out infinite" : "none",
            }}
          >
            {massageSecretTriggered && (
              <div
                style={{
                  fontSize: 17,
                  fontWeight: 700,
                  color: activeDie.color,
                  marginBottom: 8,
                  animation: "flashThenBrighten 1.3s ease-in-out 1 forwards",
                }}
              >
                Secret butt massage level
              </div>
            )}
            <div style={{ fontSize: 12, color: "#9A9A88", marginBottom: 6 }}>
              {isKissRound
                ? `Rolled for ${kissMinutes} min`
                : isToplessRound
                ? `Rolled for ${toplessMinutes} min`
                : isThirdBaseRound
                ? `Rolled for ${thirdBaseMinutes} min`
                : isD20Round
                ? `Rolled for ${d20Minutes} min`
                : massageSecretTriggered
                ? "Runs for the rest of the massage time"
                : `d4 rolled ${rollInput} · d6 rolled ${massageMinutes}`}
            </div>
            <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 14, fontFamily: "Georgia, ui-serif, serif" }}>
              {activeEntry.label}
            </div>

            {activeEntry.seconds ? (
              roundExpired ? (
                <div>
                  <div style={{ fontSize: 30, fontWeight: 700, color: "#FF9B9B", marginBottom: 10 }}>Time's up</div>
                  <button onClick={handleRoundDismiss} style={centeredPrimaryBtnStyle("#B23A48")}>
                    Dismiss
                  </button>
                </div>
              ) : (
                <div>
                  <div
                    style={{
                      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                      fontSize: 40,
                      fontWeight: 700,
                      marginBottom: 12,
                    }}
                  >
                    {formatTime(roundSeconds)}
                  </div>
                  <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: tokenCount > 0 ? 14 : 0 }}>
                    <button
                      onClick={() => { unlockAudio(); setRoundRunning((r) => !r); }}
                      style={secondaryBtnStyle}
                    >
                      {roundRunning ? <Pause size={16} /> : <Play size={16} />}
                    </button>
                  </div>
                  {tokenCount > 0 && (
                    <button onClick={spendTokenSkipAhead} style={tokenBtnStyle}>
                      <PennyIcon size={18} /> Spend token to skip ahead
                    </button>
                  )}
                </div>
              )
            ) : null}
          </div>
        )}

        {/* Token display — single icon + count, moved here just above the exit slider */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 8,
            marginTop: 24,
            padding: "8px 10px",
            background: "#20251F",
            borderRadius: 12,
            border: "1px solid #2C3128",
          }}
        >
          <PennyIcon size={22} />
          <span style={{ fontSize: 13, fontWeight: 700, color: "#C9924A" }}>{tokenCount}</span>
        </div>

        {/* Session length + menu buttons, moved just below the token display */}
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            marginTop: 14,
          }}
        >
          <div>
            <div style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#8A8A78" }}>
              Session length
            </div>
            <div
              style={{
                fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                fontSize: 34,
                fontWeight: 600,
                letterSpacing: "0.02em",
                color: "#EDE7DA",
              }}
            >
              {formatTime(sessionSeconds)}
            </div>
            {!hasStarted && (
              <div style={{ fontSize: 11, color: "#6A6E60", marginTop: 2 }}>Starts on your first roll</div>
            )}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {hasStarted && (
              <button
                onClick={() => setSessionRunning((r) => !r)}
                aria-label="Pause or resume session"
                style={iconBtnStyle(sessionRunning ? tier.color : "#6B4A45")}
              >
                {sessionRunning ? <Pause size={18} /> : <Play size={18} />}
              </button>
            )}
            <button
              onClick={testAlarm}
              aria-label="Test alarm (4 seconds)"
              title="Test alarm (4s)"
              style={iconBtnStyle("#E6AFC2")}
            >
              <Bell size={18} />
            </button>
            <button
              onClick={() => setSoundOn((s) => { const next = !s; if (next) unlockAudio(); return next; })}
              aria-label="Toggle sound"
              style={iconBtnStyle(soundOn ? tier.color : "#3A3A32")}
            >
              <Volume2 size={18} />
            </button>
            <button onClick={() => setEditOpen(true)} aria-label="Edit tables" style={iconBtnStyle("#EDE7DA")}>
              <Settings2 size={18} />
            </button>
          </div>
        </div>

        <div style={{ marginTop: 24 }}>
          <ExitSlider onExit={() => setResetConfirmOpen(true)} />
        </div>
      </div>

      {/* Edit modal */}
      {editOpen && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(10,12,9,0.92)",
            zIndex: 50,
            overflowY: "auto",
            padding: "24px 16px 60px",
          }}
        >
          <div style={{ maxWidth: 460, margin: "0 auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <div style={{ fontSize: 18, fontWeight: 700 }}>Edit tables</div>
              <button onClick={() => setEditOpen(false)} aria-label="Close" style={iconBtnStyle("#EDE7DA")}>
                <X size={18} />
              </button>
            </div>

            <div
              style={{
                marginBottom: 22,
                padding: "14px 14px 16px",
                background: "#181C15",
                border: "1px solid #3A3E34",
                borderRadius: 14,
              }}
            >
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Alarm sound</div>
              <div style={{ fontSize: 11, color: "#8A8A78" }}>
                Synthesized funk wah-wah riff — the only alarm sound in this build.
              </div>
            </div>

            <div style={{ marginBottom: 22, display: "flex", alignItems: "center", gap: 10 }}>
              <PennyIcon size={28} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>Starting tokens</div>
                <div style={{ fontSize: 11, color: "#8A8A78" }}>Applied next time you reset the session</div>
              </div>
              <input
                value={startingTokens}
                onChange={(ev) => setStartingTokens(Math.max(0, Number(ev.target.value) || 0))}
                inputMode="numeric"
                style={{ ...inputStyle, width: 50, textAlign: "center", flex: "none" }}
              />
            </div>

            {tiers.map((t, tIdx) =>
              t.entries.length === 0 ? null : (
                <div key={tIdx} style={{ marginBottom: 22 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: t.color, marginBottom: 8 }}>
                    d{t.die} — {t.name}
                  </div>
                  {t.entries.map((e, eIdx) => (
                    <div key={eIdx} style={{ display: "flex", gap: 6, marginBottom: 6, alignItems: "center" }}>
                      <div style={{ width: 20, fontSize: 12, color: "#8A8A78" }}>{eIdx + 1}</div>
                      <input
                        value={e.label}
                        onChange={(ev) => updateEntryLabel(tIdx, eIdx, "label", ev.target.value)}
                        style={inputStyle}
                      />
                    </div>
                  ))}
                </div>
              )
            )}
            <button onClick={() => setEditOpen(false)} style={primaryBtnStyle(tier.color)}>
              Save & close
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const iconBtnStyle = (color) => ({
  width: 36,
  height: 36,
  borderRadius: 10,
  border: "none",
  background: "#20251F",
  color: color,
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  cursor: "pointer",
});

const arrowBtnStyle = {
  width: 58,
  height: 58,
  borderRadius: 14,
  border: "1px solid #3A3E34",
  background: "#20251F",
  color: "#EDE7DA",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  cursor: "pointer",
};

const primaryBtnStyle = (color) => ({
  flex: 1,
  padding: "12px 16px",
  borderRadius: 12,
  border: "none",
  background: color,
  color: "#141815",
  fontWeight: 700,
  fontSize: 15,
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  cursor: "pointer",
});

// Same look as primaryBtnStyle, but shrink-wraps and centers itself instead
// of stretching to fill its container — for standalone roll buttons that
// aren't part of a multi-button row.
const centeredPrimaryBtnStyle = (color) => ({
  ...primaryBtnStyle(color),
  display: "inline-flex",
  flex: "none",
  margin: "0 auto",
});

const secondaryBtnStyle = {
  padding: "12px 16px",
  borderRadius: 12,
  border: "1px solid #3A3E34",
  background: "transparent",
  color: "#CFCBB8",
  fontWeight: 600,
  fontSize: 14,
  cursor: "pointer",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
};

const tokenBtnStyle = {
  width: "100%",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  gap: 8,
  padding: "10px 14px",
  borderRadius: 12,
  border: "1px solid #8A5A2A",
  background: "#2A2118",
  color: "#E3B876",
  fontWeight: 600,
  fontSize: 13,
  cursor: "pointer",
};

const inputStyle = {
  flex: 1,
  background: "#181C15",
  border: "1px solid #3A3E34",
  borderRadius: 8,
  padding: "8px 10px",
  color: "#EDE7DA",
  fontSize: 13,
};


class DiceGameErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    var box = document.getElementById("error-box");
    if (box) {
      box.style.display = "block";
      box.textContent += "\nREACT RENDER ERROR: " + (error && error.message ? error.message : String(error));
    }
    console.error("DiceGame render error:", error, info);
  }
  render() {
    if (this.state.error) {
      return React.createElement("div", { style: { color: "#FF9B9B", padding: 20, fontFamily: "monospace", whiteSpace: "pre-wrap" } },
        "DiceGame crashed during render:\n" + (this.state.error.message || String(this.state.error))
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DiceGameErrorBoundary><DiceGame /></DiceGameErrorBoundary>);

</script>

<script>
window.onerror = function(msg, url, line, col, error) {
  var box = document.getElementById("error-box");
  box.style.display = "block";
  box.textContent += "\nWindow error: " + msg + " (line " + line + ")";
  return false;
};
(function() {
  var box = document.getElementById("error-box");
  try {
    var code = document.getElementById("app-source").textContent;
    var output = Babel.transform(code, {
      presets: [["react", { runtime: "classic" }]],
      sourceType: "script"
    }).code;
    var wrapped = "try {\n" + output + "\n} catch(_e) { var b = document.getElementById(\'error-box\'); b.style.display=\'block\'; b.textContent += \'\\nBuild error: \' + (_e && _e.message ? _e.message : String(_e)); console.error(_e); }";
    var s = document.createElement("script");
    s.textContent = wrapped;
    document.body.appendChild(s);
  } catch (e) {
    box.style.display = "block";
    box.textContent = "Build error:\n" + (e && e.message ? e.message : String(e));
    console.error(e);
  }
})();
</script>
