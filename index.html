// Mixes two hex colors by a 0-1 amount, returning an rgb() string.
function mixHexColors(hexA, hexB, amount) {
  const t = Math.max(0, Math.min(1, amount));
  const toRgb = (hex) => {
    const clean = hex.replace("#", "");
    const n = parseInt(clean, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  };
  const a = toRgb(hexA);
  const b = toRgb(hexB);
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  return `rgb(${r}, ${g}, ${bl})`;
}

// confirmation — requires a full round-trip drag (all the way right, then
// all the way back left, in one continuous gesture) rather than a single
// tap or a one-way drag. The trough reddens progressively on the way out,
// then locks fully red once the far edge is touched — a visual "point of
// no return crossed, now finish the U-turn" cue for the return leg.
function ExitSlider({ onExit }) {
  const trackRef = useRef(null);
  const knobSize = 44;
  const [trackWidth, setTrackWidth] = useState(280);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false); // drives the CSS transition only
  const [hasReachedRight, setHasReachedRight] = useState(false); // for the label/color only

  // listener-attach effect having to depend on `onExit` (which gets a new
  // function identity every render, since the session clock re-renders the
  // parent every second) or on `dragging`/`maxX`. Depending on those caused
  // the window listeners to be torn down and reattached mid-drag, which is
  // very likely why the slide-to-exit wasn't registering reliably.
  const isDraggingRef = useRef(false);
  const onExitRef = useRef(onExit);
  const maxXRef = useRef(1);
  const hasReachedRightRef = useRef(false);

  useEffect(() => {
    onExitRef.current = onExit;
  }, [onExit]);

  useEffect(() => {
    if (trackRef.current) setTrackWidth(trackRef.current.offsetWidth);
  }, []);

  const maxX = Math.max(trackWidth - knobSize - 8, 1);
  useEffect(() => {
    maxXRef.current = maxX;
  }, [maxX]);

  const progress = Math.min(dragX / maxX, 1);
  // Trough starts reddening at 1/4 across on the way out; once the far edge
  // has been touched at least once this gesture, it stays fully red for the
  // return leg regardless of dragX, rather than fading back to green as the
  // knob comes back toward the start.
  const RED_START = 0.25;
  const displayProgress = hasReachedRight ? 1 : progress;
  const redAmount = Math.max(0, Math.min(1, (displayProgress - RED_START) / (1 - RED_START)));
  const trackBg = mixHexColors("#181C15", "#B23A48", redAmount);
  const trackBorder = mixHexColors("#3A3E34", "#B23A48", redAmount);

  const getClientX = (e) => {
    if (typeof e.clientX === "number") return e.clientX;
    if (e.touches && e.touches[0]) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX;
    return null;
  };

  const updateDragPosition = useCallback((clientX) => {
    if (!trackRef.current || clientX == null) return;
    const rect = trackRef.current.getBoundingClientRect();
    let x = clientX - rect.left - knobSize / 2;
    x = Math.max(0, Math.min(x, maxXRef.current));
    setDragX(x);

    const max = maxXRef.current;
    if (!hasReachedRightRef.current && x >= max * 0.95) {
      // Outbound leg complete — lock in the "hot" state for the return leg.
      hasReachedRightRef.current = true;
      setHasReachedRight(true);
    } else if (hasReachedRightRef.current && x <= max * 0.05) {
      // Round trip complete: far edge was touched, and we're back at the
      // start. This is the moment the gesture succeeds — end the drag right
      // here rather than waiting for pointerup.
      hasReachedRightRef.current = false;
      isDraggingRef.current = false;
      setHasReachedRight(false);
      setDragging(false);
      setDragX(0);
      if (onExitRef.current) onExitRef.current();
    }
  }, []);

  const startDrag = useCallback(
    (e) => {
      isDraggingRef.current = true;
      setDragging(true);
      hasReachedRightRef.current = false;
      setHasReachedRight(false);
      updateDragPosition(getClientX(e));
    },
    [updateDragPosition]
  );

  // Attached once, covering Pointer, Mouse, AND Touch events — some browsers
  // or embedded/sandboxed environments don't fire Pointer Events reliably,
  // so we don't bet everything on a single event family. isDraggingRef gates
  // whether these do anything, so there's no repeated subscribe/unsubscribe.
  useEffect(() => {
    const handleMove = (e) => {
      if (!isDraggingRef.current) return;
      if (e.cancelable) e.preventDefault();
      updateDragPosition(getClientX(e));
    };
    const handleEnd = () => {
      if (!isDraggingRef.current) return;
      isDraggingRef.current = false;
      setDragging(false);
      hasReachedRightRef.current = false;
      setHasReachedRight(false);
      setDragX(0);
    };

    window.addEventListener("pointermove", handleMove, { passive: false });
    window.addEventListener("pointerup", handleEnd);
    window.addEventListener("pointercancel", handleEnd);
    window.addEventListener("mousemove", handleMove, { passive: false });
    window.addEventListener("mouseup", handleEnd);
    window.addEventListener("touchmove", handleMove, { passive: false });
    window.addEventListener("touchend", handleEnd);
    window.addEventListener("touchcancel", handleEnd);
    return () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleEnd);
      window.removeEventListener("pointercancel", handleEnd);
      window.removeEventListener("mousemove", handleMove);
      window.removeEventListener("mouseup", handleEnd);
      window.removeEventListener("touchmove", handleMove);
      window.removeEventListener("touchend", handleEnd);
      window.removeEventListener("touchcancel", handleEnd);
    };
  }, [updateDragPosition]);

  return (
    <div
      ref={trackRef}
      onPointerDown={startDrag}
      onMouseDown={startDrag}
      onTouchStart={startDrag}
      style={{
        position: "relative",
        width: "100%",
        height: 52,
        borderRadius: 26,
        background: trackBg,
        border: `1px solid ${trackBorder}`,
        overflow: "hidden",
        transition: dragging ? "none" : "background 0.2s ease, border-color 0.2s ease",
        touchAction: "none",
        cursor: "grab",
      }}
    >
      <div
        style={{
          position: "absolute",
          inset: 0,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 6,
          color: hasReachedRight ? "#FFD9DC" : "#6A6E60",
          fontSize: 12,
          fontWeight: 700,
          letterSpacing: "0.1em",
          textTransform: "uppercase",
          // The outbound leg still fades the label out as the knob approaches
          // it (so it doesn't awkwardly peek out from under the knob). Once
          // the round trip's return leg has started, force it fully visible
          // instead of continuing to apply that same fade — the label sits
          // in the middle of the track, away from the knob, for this whole
          // leg, and it's the most important instruction in the gesture.
          opacity: hasReachedRight ? 1 : 1 - progress * 0.9,
          pointerEvents: "none",
        }}
      >
        {hasReachedRight ? "Now slide back" : "Slide to exit"}
        <ChevronsRight size={15} style={hasReachedRight ? { transform: "scaleX(-1)" } : undefined} />
      </div>
      <div
        style={{
          position: "absolute",
          top: 4,
          left: 4 + dragX,
          width: knobSize,
          height: knobSize,
          borderRadius: "50%",
          background: "#20251F",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          transition: dragging ? "none" : "left 0.2s ease",
          pointerEvents: "none", // the whole trough handles the drag now, not just this circle
        }}
      >
        <X size={20} color="#8A8E80" />
      </div>
    </div>
  );
}

function playSound(src) {

    audio.play().catch(() => {});
    return audio;
  } catch (e) {
    return null;

}

function formatTime(totalSeconds) {

  // must be tapped to reveal it, then a single roll picks one of its entries ---
  const [toplessUnlocked, setToplessUnlocked] = useState(false); // true once the flashing d8 icon has been tapped
  const [toplessRollIndex, setToplessRollIndex] = useState(null); // which entry (0-based) was rolled, null until rolled
  // No-repeat pool for the 2 topless rounds — draws without replacement, so
  // the same item can't come up twice across the loop.
  const [toplessAvailableIndices, setToplessAvailableIndices] = useState(() => defaultTiers[2].entries.map((_, i) => i));
  const [toplessMinutes, setToplessMinutes] = useState(null); // minutes chosen by the d4 roll (with auto-reroll-on-1) for the timer
  const [isToplessRound, setIsToplessRound] = useState(false); // true while activeEntry represents this round
  const [toplessDone, setToplessDone] = useState(false); // true once this round's timer has been dismissed
  const [toplessRoundNumber, setToplessRoundNumber] = useState(1); // 1 or 2 — 2nd base loops once (2 total rounds)
  const [toplessHasRolledOnce, setToplessHasRolledOnce] = useState(false); // hides the instruction text after the first roll, even across the second loop round

  // --- 3rd base stage, unlocked once the topless round is done — same
  // flashing d8 icon, tapped again to reveal a new set of entries ---
  const [thirdBaseUnlocked, setThirdBaseUnlocked] = useState(false); // true once the flashing d8 icon has been tapped a second time
  const [thirdBaseRollIndex, setThirdBaseRollIndex] = useState(null); // which entry (0-based) was rolled, null until rolled
  // Pool of d12 entry indices still rollable. Rolling a non-finale item
  // removes its whole category (not just itself) from the pool, so the game
  // narrows: her-focused items (finger x3, nibble-her, vulva massage) go
  // together, him-focused items (handjob x2, nibble-him, play with balls) go
  // together, and the two mutual items (69, cameltoe) go together. Index 11
  // (penetration) is the finale/HOME RUN and is never removed except by
  // being rolled, which ends the d12 stage.
  const [thirdBaseAvailableIndices, setThirdBaseAvailableIndices] = useState(() =>
    defaultTiers[3].entries.map((_, i) => i)
  );
  const [thirdBaseMinutes, setThirdBaseMinutes] = useState(null); // minutes chosen via either the d4 or d6 option
  const [thirdBaseHasRolledOnce, setThirdBaseHasRolledOnce] = useState(false); // hides the instruction text after the first d12 roll, even across later loop rounds
  const [isThirdBaseRound, setIsThirdBaseRound] = useState(false); // true while activeEntry represents this round
  const [thirdBaseDone, setThirdBaseDone] = useState(false); // true once the HOME RUN round has been dismissed
  const [d20Unlocked, setD20Unlocked] = useState(false); // true once the flashing d20 icon has been tapped
  const [d20RollIndex, setD20RollIndex] = useState(null); // which entry (0-based) was rolled, null until rolled
  // No-repeat pool, same pattern as the massage stage: draws without
  // replacement, refills once exhausted. No timer on this stage (not asked
  // for yet) — just roll, see it, roll again.
  const [d20AvailableIndices, setD20AvailableIndices] = useState(() => defaultTiers[4].entries.map((_, i) => i));
  // Permanently excluded once triggered — rolling item 1 or 2 (either butt
  // plug) bans all four insertable items (1-4) for the rest of the game,
  // even across pool refills.
  const [d20BannedIndices, setD20BannedIndices] = useState([]);
  const [d20Minutes, setD20Minutes] = useState(null); // minutes chosen by the d4 timer roll, if taken
  const [isD20Round, setIsD20Round] = useState(false); // true while activeEntry represents a d20 timer round
  const [d20FreeTokenMessage, setD20FreeTokenMessage] = useState(false); // true right after rolling the free-token entry
  const [d2FlipResult, setD2FlipResult] = useState(null); // null | "success" | "fail" — result of the 50% cum flip

  // --- reset confirmation challenge (opened by the exit slider's round trip) ---
  const [resetConfirmOpen, setResetConfirmOpen] = useState(false);
  const [resetArrowInput, setResetArrowInput] = useState([]); // arrows entered correctly so far, this attempt
  const [resetShake, setResetShake] = useState(false); // true briefly after a wrong arrow
  const [resetSuccess, setResetSuccess] = useState(false); // true once the full sequence is entered — shows the rocket, then resets
  const resetShakeTimeoutRef = useRef(null);
  const resetSuccessTimeoutRef = useRef(null);
  const whineAudioRef = useRef(null); // lets Cancel stop the whine mid-playback

  const sessionIntervalRef = useRef(null);
  const roundIntervalRef = useRef(null);
  const audioCtxRef = useRef(null);
  const beepIntervalRef = useRef(null);
  const wakeLockRef = useRef(null);

  // --- keep the screen awake for as long as the app is open ---
  // Screen Wake Lock API: tells the OS not to dim/lock the display. This is
  // also the single biggest fix for missed alarms: once iOS actually locks
  // the screen, Safari fully suspends the tab — every timer, every audio
  // node, everything — and no in-page redundancy can survive that. Keeping
  // the screen on keeps the JS running in the first place.
  // Supported on iOS/iPadOS Safari 16.4+, including apps added to the home
  // screen. Older Safari silently no-ops here (the try/catch below) — every
  // other alarm channel still works whenever the tab itself is running.
  const requestWakeLock = useCallback(async () => {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLockRef.current = await navigator.wakeLock.request("screen");
      wakeLockRef.current.addEventListener("release", () => {
        wakeLockRef.current = null;
      });
    } catch (e) {
      // denied (e.g. Low Power Mode) or unsupported — fail silently
    }
  }, []);

  useEffect(() => {
    requestWakeLock();
    // The lock is auto-released whenever the tab is hidden (backgrounded,
    // screen turned off, app-switched away from). Re-request it the instant
    // the tab is visible again so the screen stays awake for every moment
    // the app is actually in front — this can't prevent the very first
    // hide event, but it stops it from happening a second time in the
    // same session.
    const onVisible = () => {
      if (document.visibilityState === "visible") requestWakeLock();
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      if (wakeLockRef.current) wakeLockRef.current.release().catch(() => {});
    };
  }, [requestWakeLock]);

  const tier = tiers[tierIndex];
  const Shape = SHAPES[tierIndex];

  // --- session clock ---
  useEffect(() => {
    if (sessionRunning) {
      sessionIntervalRef.current = setInterval(() => {
        setSessionSeconds((s) => s + 1);
      }, 1000);
    }
    return () => clearInterval(sessionIntervalRef.current);
  }, [sessionRunning]);

  // --- round countdown ---
  useEffect(() => {
    if (roundRunning && roundSeconds > 0) {
      roundIntervalRef.current = setInterval(() => {
        setRoundSeconds((s) => {
          if (s <= 1) {
            setRoundRunning(false);
            setRoundExpired(true);
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(roundIntervalRef.current);
  }, [roundRunning]);

  // --- nudge: an item's been rolled and its instructions are up, but the
  // timer die hasn't been rolled yet for this round ---
  // activeEntry itself is only set once a time roll happens — every
  // setActiveEntry call already carries a computed `seconds`. The gap
  // between "item rolled" and "time rolled" instead lives in each tier's
  // own roll-index/body-part state while activeEntry is still null:
  //   - massage: massageBodyPart is set by the d4, before the d6 (minutes)
  //   - naked / sexy / kinky: {tier}RollIndex is set by that die, before
  //     the follow-up time roll
  // Kissing has no such gap — its one roll sets label and timer together.
  // After 3 uninterrupted seconds sitting in one of these gaps, pulse the
  // box the same way the expired-alarm screen does, as a nudge to go roll
  // time.
  const awaitingTimeRoll =
    !activeEntry &&
    (!!massageBodyPart ||
      toplessRollIndex !== null ||
      thirdBaseRollIndex !== null ||
      d20RollIndex !== null);
  useEffect(() => {
    if (!awaitingTimeRoll) {
      setAwaitingTimeFlash(false);
      return;
    }
    const t = setTimeout(() => setAwaitingTimeFlash(true), 3000);
    return () => clearTimeout(t);
  }, [awaitingTimeRoll, massageBodyPart, toplessRollIndex, thirdBaseRollIndex, d20RollIndex]);

  // --- alarm sound when round expires ---
  const getCtx = useCallback(() => {
    if (!audioCtxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new AC();
    }
    return audioCtxRef.current;
  }, []);

  // iOS Safari suspends new AudioContexts until they're resumed inside a
  // direct user gesture (a tap). The round timer expires on its own via a
  // background interval, which does NOT count as a gesture — so without
  // this, the very first alarm can be silent even with sound "on."
  // Call this from every button handler so the context is already running
  // by the time an alarm needs to fire.
  const unlockAudio = useCallback(() => {
    try {
      const ctx = getCtx();
      if (ctx.state === "suspended") {
        ctx.resume();
      }
      // Play a near-silent blip so iOS fully commits the context to "running".
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0.00001;
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.01);
    } catch (e) {
      // ignore — will retry unlock on the next tap
    }
  }, [getCtx]);

  // --- alarm sound: the recorded/pitched funk guitar riff, looped ---
  // Previously a fully synthesized wah-wah riff re-triggered on an interval;
  // now it's the real sample (pitched down an octave, same tempo, harmonic
  // exciter pass to restore the high-end "twang" a plain pitch-shift lost —
  // see SOUND_ALARM_RIFF), looped natively via the audio element instead of
  // being re-scheduled by hand.
  const ALARM_LOOP_MS = 3866; // one loop of SOUND_ALARM_RIFF, for the vibration cadence below
  const alarmAudioRef = useRef(null);
  // A ref mirror of soundOn so playAlarmSound/stopAlarmSound can have a
  // permanently stable identity (empty dependency array) — see the note
  // below on why that matters for not restarting the loop on mute/unmute.
  const soundOnRef = useRef(soundOn);
  useEffect(() => {
    soundOnRef.current = soundOn;
  }, [soundOn]);

  const playAlarmSound = useCallback(() => {
    if (!soundOnRef.current) return;
    try {
      if (!alarmAudioRef.current) {
        alarmAudioRef.current = new Audio(SOUND_ALARM_RIFF);
        alarmAudioRef.current.loop = true;
      }
      // Idempotent: safe to call repeatedly (e.g. from the visibilitychange
      // catch-up below) without restarting an already-playing loop. If the
      // browser paused it in the background, this resumes from wherever it
      // left off rather than jumping back to the start.
      if (alarmAudioRef.current.paused) {
        alarmAudioRef.current.play().catch(() => {});
      }
    } catch (e) {
      // audio unavailable, fail silently
    }
  }, []);

  const stopAlarmSound = useCallback(() => {
    const audio = alarmAudioRef.current;
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
    }
  }, []);

  // Starts/stops the loop exactly on roundExpired transitions. playAlarmSound
  // and stopAlarmSound both have stable (empty-dependency) identities, so
  // this effect does NOT re-run when soundOn changes — that's handled
  // separately below, so muting mid-alarm doesn't reset playback to 0:00.
  useEffect(() => {
    if (roundExpired) {
      playAlarmSound();
    } else {
      stopAlarmSound();
    }
    return () => {
      stopAlarmSound();
    };
  }, [roundExpired, playAlarmSound, stopAlarmSound]);

  // Toggling the sound switch while the alarm is already looping should take
  // effect immediately — pause (keeping position) on mute, resume on unmute —
  // rather than waiting for the round to change.
  useEffect(() => {
    if (!roundExpired) return;
    if (soundOn) {
      playAlarmSound();
    } else if (alarmAudioRef.current) {
      alarmAudioRef.current.pause();
    }
  }, [soundOn, roundExpired, playAlarmSound]);

  // --- redundancy #1: catch up immediately on return ---
  // Mobile browsers commonly pause background audio outright while the tab
  // is hidden, regardless of wake-lock state. The moment the tab is visible
  // again, resume right away instead of waiting for anything else to notice.
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === "visible" && roundExpired) {
        playAlarmSound();
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [roundExpired, playAlarmSound]);

  // --- redundancy #2: vibration channel ---
  // A second, non-audio alert running in parallel with the sound so a
  // muted phone, a silenced-switch iPhone, or a missed/suppressed sound
  // still gets caught. NOTE: iOS Safari does not support the Vibration
  // API at all (even for apps added to the home screen) as of this
  // writing, so on this iPhone build `navigator.vibrate` is simply
  // undefined and this effect is a harmless no-op. It's here as a real
  // backup the moment this game is ever opened on Android/Chrome, and
  // costs nothing to leave in.
  useEffect(() => {
    if (roundExpired && navigator.vibrate) {
      navigator.vibrate([400, 200, 400, 200, 400]);
      const vibrateInterval = setInterval(
        () => navigator.vibrate([400, 200, 400, 200, 400]),
        ALARM_LOOP_MS
      );
      return () => clearInterval(vibrateInterval);
    }
  }, [roundExpired]);

  // Called on every arrow-button press while the reset confirmation is open.
  // Wrong arrow at any point: shake, wipe progress, let them try again.
  // Right arrow, sequence complete: show the rocket, then actually reset.
  const handleResetArrowPress = (dir) => {
    if (resetSuccess) return;
    const next = [...resetArrowInput, dir];
    const correctSoFar = next.every((d, i) => d === RESET_SEQUENCE[i]);
    if (!correctSoFar) {
      setResetArrowInput([]);
      setResetShake(true);
      clearTimeout(resetShakeTimeoutRef.current);
      resetShakeTimeoutRef.current = setTimeout(() => setResetShake(false), 500);
      playSound(SOUND_ERROR);
      return;
    }

    // Correct arrow — one of the three captured click sounds, cycling
    // 1-2-3-1-2-3 across the six-step sequence.
    playSound(CLICK_SOUNDS[(next.length - 1) % CLICK_SOUNDS.length]);

    if (next.length === RESET_SEQUENCE.length) {
      // Sequence complete: keep the boxes showing fully filled, play the
      // electric whine, and only reveal the rocket once the whine has had
      // time to finish — the whine is the "windup" before the payoff.
      setResetArrowInput(next);
      whineAudioRef.current = playSound(SOUND_WHINE);
      clearTimeout(resetSuccessTimeoutRef.current);
      resetSuccessTimeoutRef.current = setTimeout(() => {
        setResetSuccess(true);
        setResetArrowInput([]);
        resetSuccessTimeoutRef.current = setTimeout(() => {
          resetSession();
          setResetSuccess(false);
          setResetConfirmOpen(false);
        }, 1600);
      }, WHINE_DELAY_MS);
    } else {
      setResetArrowInput(next);
    }
  };

  const cancelResetConfirm = () => {
    clearTimeout(resetShakeTimeoutRef.current);
    clearTimeout(resetSuccessTimeoutRef.current);
    if (whineAudioRef.current) {
      whineAudioRef.current.pause();
      whineAudioRef.current = null;
    }
    setResetConfirmOpen(false);
    setResetArrowInput([]);
    setResetShake(false);
    setResetSuccess(false);
  };

  useEffect(() => {
    return () => {
      clearTimeout(resetShakeTimeoutRef.current);
      clearTimeout(resetSuccessTimeoutRef.current);
      if (whineAudioRef.current) whineAudioRef.current.pause();
    };
  }, []);

  const resetSession = () => {
    setHasStarted(false);
    setSessionRunning(false);
    setSessionSeconds(0);
    setTierIndex(0);
    setTokenCount(startingTokens);
    setMassageBodyPart(null);
    setMassageSetIndex(0);
    setMassageAvailableIndices(MASSAGE_SET_A_INDICES);
    setMassageSecretTriggered(false);
    setMassageMinutes(null);
    setMassageTotalSeconds(0);
    setMassageComplete(false);
    setKissMinutes(null);
    setKissDone(false);
    setIsKissRound(false);
    setToplessUnlocked(false);
    setToplessRollIndex(null);
    setToplessMinutes(null);
    setIsToplessRound(false);
    setToplessDone(false);
    setToplessRoundNumber(1);
    setToplessHasRolledOnce(false);
    setToplessAvailableIndices(defaultTiers[2].entries.map((_, i) => i));
    setThirdBaseUnlocked(false);
    setThirdBaseRollIndex(null);
    setThirdBaseAvailableIndices(defaultTiers[3].entries.map((_, i) => i));
    setThirdBaseMinutes(null);
    setThirdBaseHasRolledOnce(false);
    setIsThirdBaseRound(false);
    setThirdBaseDone(false);
    setD20Unlocked(false);
    setD20RollIndex(null);
    setD20AvailableIndices(defaultTiers[4].entries.map((_, i) => i));
    setD20BannedIndices([]);
    setD20Minutes(null);
    setIsD20Round(false);
    setD20FreeTokenMessage(false);
    setD2FlipResult(null);
    setLadyCumsCount(0);
    pendingLadyCumRef.current = false;
    clearRound();
  };

  const clearRound = () => {
    setActiveEntry(null);
    setRollInput(null);
    setRoundSeconds(0);
    setRoundRunning(false);
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
  };

  // Step 1 — roll the d4 to pick a spot. Locked to this one tier, so this is
  // always the whole interaction: no manual number entry, no tier switching.
  // Once both spot-sets are used up, the finale runs "Butt massage" for
  // whatever time remains to reach the 10-minute target — no more rolling.
  const beginSecretButtMassage = () => {
    const remainingSeconds = Math.max(60, MASSAGE_TARGET_SECONDS - massageTotalSeconds);
    const minutesExact = remainingSeconds / 60;
    const minutesDisplay = Math.round(minutesExact * 10) / 10;
    setMassageSetIndex(2);
    setMassageSecretTriggered(true);
    setRollInput(null);
    setMassageBodyPart("Butt massage");
    setMassageMinutes(minutesExact);
    setActiveEntry({ label: `Butt massage — ${minutesDisplay} min`, seconds: remainingSeconds });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(remainingSeconds);
    setRoundRunning(true);
  };

  const rollBodyPart = () => {
    unlockAudio();
    playDieRollSound(4);
    consumePendingLadyCum();
    if (!hasStarted) {
      setHasStarted(true);
      setSessionRunning(true);
    }

    if (massageAvailableIndices.length === 0) {
      if (massageSetIndex === 0) {
        // primary set exhausted — advance to the secondary set and pick from it right away
        const pick = MASSAGE_SET_B_INDICES[Math.floor(Math.random() * MASSAGE_SET_B_INDICES.length)];
        setMassageSetIndex(1);
        setRollInput(pick + 1);
        setMassageBodyPart(tier.entries[pick].label);
        setMassageAvailableIndices(MASSAGE_SET_B_INDICES.filter((i) => i !== pick));
        return;
      }
      // secondary set also exhausted — the secret finale takes over instead of rolling again
      beginSecretButtMassage();
      return;
    }

    const pool = massageAvailableIndices;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setRollInput(pick + 1);
    setMassageBodyPart(tier.entries[pick].label);
    setMassageAvailableIndices(pool.filter((i) => i !== pick));
  };

  // Step 2 — roll a d6 for minutes; the number IS the minutes, and the timer
  // starts immediately (no separate "start" step).
  const rollMinutesAndStart = () => {
    unlockAudio();
    playDieRollSound(6);
    consumePendingLadyCum();
    const minutes = Math.floor(Math.random() * 6) + 1;
    setMassageMinutes(minutes);
    setActiveEntry({ label: `${massageBodyPart} — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  // Step 3 — called when a round ends (dismissing the alarm, or manually
  // clearing). Banks this round's minutes toward the 10-minute target, and
  // loops back to step 1 automatically unless the target's been reached.
  const finishMassageRound = () => {
    const roundSecondsBanked = (massageMinutes || 0) * 60;
    setMassageTotalSeconds((prevTotal) => {
      const newTotal = prevTotal + roundSecondsBanked;
      if (newTotal >= MASSAGE_TARGET_SECONDS) {
        setMassageComplete(true);
      }
      return newTotal;
    });
    clearRound();
    setMassageBodyPart(null);
    setMassageMinutes(null);
  };

  // "Kissing unlocked" round — roll a d4 for minutes (face value = minutes).
  // Now rolled with d6 instead of d4 — d4 is reserved for the one place with
  // an actual player choice (the 3rd base time roll). The old d4-reroll
  // mechanic covered 2-7 minutes across 6 possible outcomes, which a d6 maps
  // onto exactly with whole numbers, so no fractional minutes are needed here.
  const KISS_TIME_OPTIONS = [2, 3, 4, 5, 6, 7];
  const beginKissTimer = (minutes) => {
    setIsKissRound(true);
    setKissMinutes(minutes);
    setActiveEntry({ label: `Kissing — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  const rollKissTime = () => {
    unlockAudio();
    playDieRollSound(6);
    consumePendingLadyCum();
    const roll = Math.floor(Math.random() * 6); // 0-5
    beginKissTimer(KISS_TIME_OPTIONS[roll]);
  };

  const finishKissRound = () => {
    clearRound();
    setIsKissRound(false);
    setKissDone(true);
  };

  // Routes round-completion to whichever loop is active — the repeating
  // massage rounds, the one-off kissing round, or the one-off topless round.
  const handleRoundDismiss = () => {
    if (isKissRound) {
      finishKissRound();
    } else if (isToplessRound) {
      finishToplessRound();
    } else if (isThirdBaseRound) {
      finishThirdBaseRound();
    } else if (isD20Round) {
      finishD20Round();
    } else {
      finishMassageRound();
    }
  };

  // Tapping the flashing d8 icon reveals the topless stage.
  const unlockTopless = () => {
    unlockAudio();
    setToplessUnlocked(true);
  };

  // Tapping the flashing d8 icon a second time (after topless is done) reveals 3rd base.
  const unlockThirdBase = () => {
    unlockAudio();
    setThirdBaseUnlocked(true);
  };

  // Tapping the flashing d20 icon (after the d12 HOME RUN round is dismissed).
  const unlockD20 = () => {
    unlockAudio();
    setD20Unlocked(true);
  };

  const rollD20 = () => {
    unlockAudio();
    playDieRollSound(20);
    consumePendingLadyCum();
    const usablePool = d20AvailableIndices.filter((i) => !d20BannedIndices.includes(i));
    const fallbackPool = tiers[4].entries.map((_, i) => i).filter((i) => !d20BannedIndices.includes(i));
    const pool = usablePool.length > 0 ? usablePool : fallbackPool;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setD20RollIndex(pick);
    setD2FlipResult(null); // clear any previous coin-flip result on a fresh roll

    // Rolling either butt plug (index 0 or 1) bans all four insertable
    // items (indices 0-3) for the rest of the game, even after the pool
    // would otherwise refill.
    const triggersBan = pick === 0 || pick === 1;
    const newBanned = triggersBan ? [0, 1, 2, 3] : d20BannedIndices;
    if (triggersBan) setD20BannedIndices(newBanned);

    const fullPool = tiers[4].entries.map((_, i) => i).filter((i) => !newBanned.includes(i));
    const remaining = pool.filter((i) => i !== pick && !newBanned.includes(i));
    // On refill, exclude the just-picked item too — otherwise the same
    // result could come up twice in a row right at the cycle boundary.
    setD20AvailableIndices(remaining.length > 0 ? remaining : fullPool.filter((i) => i !== pick));

    // Landing on "Free token" grants it immediately — no timer applies.
    if (tiers[4].entries[pick].special === "freeToken") {
      setD20FreeTokenMessage(true);
      setTokenCount((c) => c + 1);
    } else {
      setD20FreeTokenMessage(false);
    }

    // Landing on "Allowed to cum" doesn't tick the counter right away — it
    // arms it, so it ticks up on whatever roll the player makes next.
    if (tiers[4].entries[pick].special === "allowedToCum") {
      pendingLadyCumRef.current = true;
    }
  };

  // Roll a d4 for time on the current d20 item, and start its timer.
  const beginD20Timer = () => {
    unlockAudio();
    playDieRollSound(4);
    consumePendingLadyCum();
    const minutes = Math.floor(Math.random() * 4) + 1; // 1-4
    setD20Minutes(minutes);
    setIsD20Round(true);
    setActiveEntry({ label: `${tiers[4].entries[d20RollIndex].label} — ${minutes} min`, seconds: minutes * 60 });
    setRoundExpired(false);
    clearInterval(beepIntervalRef.current);
    setRoundSeconds(minutes * 60);
    setRoundRunning(true);
  };

  const finishD20Round = () => {
    clearRound();
    setIsD20Round(false);
    setD20RollIndex(null); // back to "Roll dice" for the next round
  };

            )}
            <div style={{ fontSize: 12, color: "#9A9A88", marginBottom: 6 }}>
              {isKissRound
                ? `Rolled for ${kissMinutes} min`
                : isToplessRound
                ? `Rolled for ${toplessMinutes} min`
                : isThirdBaseRound
                ? `Rolled for ${thirdBaseMinutes} min`
                : isD20Round
                ? `Rolled for ${d20Minutes} min`
                : massageSecretTriggered
                ? "Runs for the rest of the massage time"
                : `d4 rolled ${rollInput} · d6 rolled ${massageMinutes}`}
            </div>
            <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 14, fontFamily: "Georgia, ui-serif, serif" }}>
              {activeEntry.label}
            </div>

            {activeEntry.seconds ? (
              roundExpired ? (
                <div>
                  <div style={{ fontSize: 30, fontWeight: 700, color: "#FF9B9B", marginBottom: 10 }}>Time's up</div>
                  <button onClick={handleRoundDismiss} style={centeredPrimaryBtnStyle("#B23A48")}>
                    Dismiss
                  </button>
                </div>
              ) : (
                <div>
                  <div
                    style={{
                      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                      fontSize: 40,
                      fontWeight: 700,
                      marginBottom: 12,
                    }}
                  >
                    {formatTime(roundSeconds)}
                  </div>
                  <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: tokenCount > 0 ? 14 : 0 }}>
                    <button
                      onClick={() => { unlockAudio(); setRoundRunning((r) => !r); }}
                      style={secondaryBtnStyle}
                    >
                      {roundRunning ? <Pause size={16} /> : <Play size={16} />}
                    </button>
                  </div>
                  {tokenCount > 0 && (
                    <button onClick={spendTokenSkipAhead} style={tokenBtnStyle}>
                      <PennyIcon size={18} /> Spend token to skip ahead
                    </button>
                  )}
                </div>
              )
            ) : null}
          </div>
        )}

        {/* Token display, plus the "Lady cums" counter on the right — moved
            here just above the exit slider */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            marginTop: 24,
            padding: "8px 10px",
            background: "#20251F",
            borderRadius: 12,
            border: "1px solid #2C3128",
          }}
        >
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <PennyIcon size={22} />
            <span style={{ fontSize: 13, fontWeight: 700, color: "#C9924A" }}>{tokenCount}</span>
          </div>
          <div
            style={{ display: "flex", alignItems: "center", gap: 8 }}
            title="Lady cums"
            aria-label="Lady cums count"
          >
            <span style={{ fontSize: 16 }}>💦</span>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#C9924A" }}>{ladyCumsCount}</span>
          </div>
        </div>

        {/* Session length + menu buttons, moved just below the token display */}
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            marginTop: 14,
          }}
        >
          <div>
            <div style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#8A8A78" }}>
              Session length
            </div>
            <div
              style={{
                fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                fontSize: 34,
                fontWeight: 600,
                letterSpacing: "0.02em",
                color: "#EDE7DA",
              }}
            >
              {formatTime(sessionSeconds)}
            </div>
            {!hasStarted && (
              <div style={{ fontSize: 11, color: "#6A6E60", marginTop: 2 }}>Starts on your first roll</div>
            )}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {hasStarted && (
              <button
                onClick={() => setSessionRunning((r) => !r)}
                aria-label="Pause or resume session"
                style={iconBtnStyle(sessionRunning ? tier.color : "#6B4A45")}
              >
                {sessionRunning ? <Pause size={18} /> : <Play size={18} />}
              </button>
            )}
            <button
              onClick={testAlarm}
              aria-label="Test alarm (4 seconds)"
              title="Test alarm (4s)"
              style={iconBtnStyle("#E6AFC2")}
            >
              <Bell size={18} />
            </button>
            <button
              onClick={() => setSoundOn((s) => { const next = !s; if (next) unlockAudio(); return next; })}
              aria-label="Toggle sound"
              style={iconBtnStyle(soundOn ? tier.color : "#3A3A32")}
            >
              <Volume2 size={18} />
            </button>
            <button onClick={() => setEditOpen(true)} aria-label="Edit tables" style={iconBtnStyle("#EDE7DA")}>
              <Settings2 size={18} />
            </button>
          </div>
        </div>

        <div style={{ marginTop: 24 }}>
          <ExitSlider onExit={() => setResetConfirmOpen(true)} />
        </div>
      </div>

      {/* Edit modal */}
      {editOpen && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(10,12,9,0.92)",
            zIndex: 50,
            overflowY: "auto",
            padding: "24px 16px 60px",
          }}
        >
          <div style={{ maxWidth: 460, margin: "0 auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <div style={{ fontSize: 18, fontWeight: 700 }}>Edit tables</div>
              <button onClick={() => setEditOpen(false)} aria-label="Close" style={iconBtnStyle("#EDE7DA")}>
                <X size={18} />
              </button>
            </div>

            <div
              style={{
                marginBottom: 22,
                padding: "14px 14px 16px",
                background: "#181C15",
                border: "1px solid #3A3E34",
                borderRadius: 14,
              }}
            >
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Alarm sound</div>
              <div style={{ fontSize: 11, color: "#8A8A78" }}>
                Synthesized funk wah-wah riff — the only alarm sound in this build.
              </div>
            </div>

            <div style={{ marginBottom: 22, display: "flex", alignItems: "center", gap: 10 }}>
              <PennyIcon size={28} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>Starting tokens</div>
                <div style={{ fontSize: 11, color: "#8A8A78" }}>Applied next time you reset the session</div>
              </div>
              <input
                value={startingTokens}
                onChange={(ev) => setStartingTokens(Math.max(0, Number(ev.target.value) || 0))}
                inputMode="numeric"
                style={{ ...inputStyle, width: 50, textAlign: "center", flex: "none" }}
              />
            </div>

            {tiers.map((t, tIdx) =>
              t.entries.length === 0 ? null : (
                <div key={tIdx} style={{ marginBottom: 22 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: t.color, marginBottom: 8 }}>
                    d{t.die} — {t.name}
                  </div>
                  {t.entries.map((e, eIdx) => (
                    <div key={eIdx} style={{ display: "flex", gap: 6, marginBottom: 6, alignItems: "center" }}>
                      <div style={{ width: 20, fontSize: 12, color: "#8A8A78" }}>{eIdx + 1}</div>
                      <input
                        value={e.label}
                        onChange={(ev) => updateEntryLabel(tIdx, eIdx, "label", ev.target.value)}
                        style={inputStyle}
                      />
                    </div>
                  ))}
                </div>
              )
            )}
            <button onClick={() => setEditOpen(false)} style={primaryBtnStyle(tier.color)}>
              Save & close
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const iconBtnStyle = (color) => ({
  width: 36,
  height: 36,
  borderRadius: 10,
  border: "none",
  background: "#20251F",
  color: color,
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  cursor: "pointer",
});

const arrowBtnStyle = {
  width: 58,
  height: 58,
  borderRadius: 14,
  border: "1px solid #3A3E34",
  background: "#20251F",
  color: "#EDE7DA",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  cursor: "pointer",
};

const primaryBtnStyle = (color) => ({
  flex: 1,
  padding: "12px 16px",
  borderRadius: 12,
  border: "none",
  background: color,
  color: "#141815",
  fontWeight: 700,
  fontSize: 15,
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  cursor: "pointer",
});

// Same look as primaryBtnStyle, but shrink-wraps and centers itself instead
// of stretching to fill its container — for standalone roll buttons that
// aren't part of a multi-button row.
const centeredPrimaryBtnStyle = (color) => ({
  ...primaryBtnStyle(color),
  display: "inline-flex",
  flex: "none",
  margin: "0 auto",
});

const secondaryBtnStyle = {
  padding: "12px 16px",
  borderRadius: 12,
  border: "1px solid #3A3E34",
  background: "transparent",
  color: "#CFCBB8",
  fontWeight: 600,
  fontSize: 14,
  cursor: "pointer",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
};

const tokenBtnStyle = {
  width: "100%",
  display: "flex",
  alignItems: "center",
  justifyContent: "center",
  gap: 8,
  padding: "10px 14px",
  borderRadius: 12,
  border: "1px solid #8A5A2A",
  background: "#2A2118",
  color: "#E3B876",
  fontWeight: 600,
  fontSize: 13,
  cursor: "pointer",
};

const inputStyle = {
  flex: 1,
  background: "#181C15",
  border: "1px solid #3A3E34",
  borderRadius: 8,
  padding: "8px 10px",
  color: "#EDE7DA",
  fontSize: 13,
};


class DiceGameErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    var box = document.getElementById("error-box");
    if (box) {
      box.style.display = "block";
      box.textContent += "\nREACT RENDER ERROR: " + (error && error.message ? error.message : String(error));
    }
    console.error("DiceGame render error:", error, info);
  }
  render() {
    if (this.state.error) {
      return React.createElement("div", { style: { color: "#FF9B9B", padding: 20, fontFamily: "monospace", whiteSpace: "pre-wrap" } },
        "DiceGame crashed during render:\n" + (this.state.error.message || String(this.state.error))
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DiceGameErrorBoundary><DiceGame /></DiceGameErrorBoundary>);

</script>

<script>
window.onerror = function(msg, url, line, col, error) {
  var box = document.getElementById("error-box");
  box.style.display = "block";
  box.textContent += "\nWindow error: " + msg + " (line " + line + ")";
  return false;
};
(function() {
  var box = document.getElementById("error-box");
  try {
    var code = document.getElementById("app-source").textContent;
    var output = Babel.transform(code, {
      presets: [["react", { runtime: "classic" }]],
      sourceType: "script"
    }).code;
    var wrapped = "try {\n" + output + "\n} catch(_e) { var b = document.getElementById(\'error-box\'); b.style.display=\'block\'; b.textContent += \'\\nBuild error: \' + (_e && _e.message ? _e.message : String(_e)); console.error(_e); }";
    var s = document.createElement("script");
    s.textContent = wrapped;
    document.body.appendChild(s);
  } catch (e) {
    box.style.display = "block";
    box.textContent = "Build error:\n" + (e && e.message ? e.message : String(e));
    console.error(e);
  }
})();
</script>
